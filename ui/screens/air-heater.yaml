# Air-heater (parking heater) screen — extracted from decompiled
# CaliforniaOnTour app.
# Source: string-resource KEYS harvested from the resource-accessor class
#   x9/i0.java (a pure StringResource lazy-getter class, same style as the
#   coolbox accessors — only the KEY NAMES are meaningful, no widget logic).
# NOTE: rg pattern also matched keys prefixed "HeaterPage_" (capital H, in
#   ea/w.java + x9/i1.java) — those belong to a DIFFERENT screen
#   ("livingRoomHeater" / combined water+air heater, dictionary function
#   `livingroomheater`) and are intentionally EXCLUDED here per the task's
#   scope (only coolbox.yaml + air-heater.yaml requested).
#
# Protocol/action linkage cross-referenced against:
#   - protocol/dictionary.yaml -> functions.airheater (state_services
#     [1700,1702], control_source sf/a.java — the SAME shared bit-packed
#     control-register class used by the cooler function, see coolbox.yaml
#     notes; this is why dictionary.yaml marks several airheater offsets
#     "MERGED_AMBIGUOUS").
#   - rf/b.java — the AirHeater screen ViewModel, class `rf.b`, which
#     implements TWO interfaces:
#       * we.b  — the airHeaterPage (parking heater) controls used below.
#       * df.a  — timer/combined-device controls (methods a2, j4, B1, M1,
#                 b2). a2(AIR_HEATER) is this page's "Start timer" and j4
#                 its "Stop" (APP-OBSERVED 2026-09-16) — modeled in
#                 timerWidget below; B1/M1/b2 stay out of scope.
#     Action letters below are the LITERAL decompiled method names on
#     `rf.b`, confirmed by reading the method bodies:
#       C2(boolean, ...)   -> writes control field "NormalOperationRequest"
#                             (immediate/"now" heating on/off)
#       q4(int, ...)       -> writes control field "HeatingLevel"; validated
#                             in-app to 1..10 (protocol raw_range is 0..15)
#       D4(int, ...)       -> writes control field "RunningTime" (single int,
#                             no in-app range check found — UNVERIFIED units,
#                             likely minutes)
#       B0(m, ...)         -> writes control fields "TimerHour"+"TimerMin" as
#                             a pair (start-heating-at time picker).
#                             APP-OBSERVED 2026-09-27: fired on the wheel's
#                             OK; 09:31 -> 3f7b007f091f.
#       E3(fz.i)           -> writes control field "PermanentOperationRequest"
#                             = 0 (OFF/cancel). NOTE: no literal "=1" (turn ON)
#                             call site was found anywhere in rf/b.java for
#                             this field — the ON path is UNVERIFIED.
#       H3(we.a, ...)      -> writes control field "AirDistribution" (enum
#                             we.a: FRONT_AND_REAR/FRONT/REAR -> 1/2/3). No
#                             matching airHeaterPage_* string key was found
#                             for this control, so it is NOT modeled as a
#                             widget below — noted here only.
screen: air-heater
title_key: airHeaterPage_pageTitle_heating_text
title_text: Heating    # APP-OBSERVED 2026-09-27 (inventory screen 34)
function: airheater
widgets:
  - id: imediateHeatingWidget
    type: toggle
    label_key: airHeaterPage_imediateHeatingWidget_imediateHeating_text
    range: null
    controls: {field: NormalOperationRequest, action: C2}
    elements: []
    constraints: "Never greyed. ON while ErrorCode 5 (OPERATION_NOT_POSSIBLE): the app writes NOTHING and re-shows 'The auxiliary air heater cannot be activated when the engine is running or when the auxiliary water heater is activated.' — codes 1-4, 6, 7 do not block; OFF always passes. ON while continuous heating is on: 'Turn off continuous heating? You can only turn continuous heating on again using the controls in your California.' then a plain NormalOperationRequest=1. No ignition/engine/battery gate. calictl: command_precondition REASON_AIRHEATER_NOT_POSSIBLE (Python + ESP C twin), web confirm; the switch shows NormalOperation alone (semantics `normal`)."
    evidence: DECOMPILE 5.4.0.3036 + APP-OBSERVED 2026-10-11 (thinky lab vs fake unit) + REAL PHONE 2026-10-11 (at the van)

  - id: heatingSlider
    type: slider
    label_key: airHeaterPage_heatingSlider_heatingTemperature_text
    range: "1..10 (ticks 1-9, HI = 10)"
    label_text: Heating Temperature
    controls: {field: HeatingLevel, action: q4}
    elements: []
    constraints: "UI validates 0 < value <= 10 before writing (protocol raw_range is 0..15). Ticks 1..9 plus HI (APP-OBSERVED 2026-09-16/27)."
    evidence: APP-OBSERVED 2026-09-27 | DECOMPILE

  - id: runTimeSlider
    type: slider
    label_key: airHeaterPage_runTimeSlider_runTime_text
    label_text: "Run Time: N min"
    range: "10..120"
    controls: {field: RunningTime, action: D4}
    elements: []
    constraints: "Minutes, slider 10..120 in 10-min steps (2026-10-11; the 2026-09-16 '~11 min ticks' was the tick-mark spacing). GREYED while continuous heating (PermanentOperation) is on; the level slider is never greyed. A change while heating raises applyDialog ('Apply new settings now? Resetting the duration. The heating will stay on for N minutes.'); on Apply the app writes THREE frames: OFF 3c7b007f1f3f, RunningTime, ON 3d7b007f1f3f — calictl keeps its single RunningTime write (owner rule: no heater short cycles; the 3-frame sequence is unverified on the unit — OPEN). calictl: web disabled + REASON_AIRHEATER_RUNTIME_PERMANENT. REAL VAN 2026-10-11: real phone shows 10…120 with 12 ticks; calictl 'runtime 30' (3f7b001e1f3f) then 'power on' ran the heater exactly 30 min (RunningTimeinAction 30→0, then NormalOperation off). D4 writes the raw int unclamped; the cap is UI-side (infoPage_heating_immediate_description: 'limited to 120 minutes'; unit raises ErrorCode 4 HEATING_TIME_EXCEEDED past it). Protocol raw_range is 0..255."

  - id: timerWidget
    type: timer
    label_key: airHeaterPage_timerWidget_startTimer_text
    range: null
    controls: {field: "TimerHour/TimerMin (B0); OperationModeAirHeater+OperationModeCombined (a2 arm / j4 stop)", action: "B0, a2, j4"}
    elements:
      - afterTheTimerIsActivated_text
      - heatingWillStart_text
      - startHeatingAt_text
    constraints: "The 'Start heating at' row is GREYED (tap does nothing) while the timer is armed (OperationModeAirHeater 3) — 2026-10-11, also on the real phone during the calictl-driven van run; there calictl's timer 23:31 / timer_start / timer_cancel were stored + reported by the unit (1702 Mode 3 then 0) and the app showed 'The heating starts today at 23:31 and stays on for 60 minutes.' / 'Inactive • Timer: 23:31'; calictl: web disabled + REASON_AIRHEATER_TIMER_ARMED. OBSERVED on the running app 2026-09-16 (tools/applab): expander row 'Timer: Off/On'; body = explanatory text ('After the timer is activated, the heating starts tomorrow at HH:MM and stays on for N min' / armed: 'The heating starts tomorrow at HH:MM and stays on for N min'), 'Start heating at: HH:MM' picker row, then ONE button — 'Start timer' when off, 'Stop' when armed. Start timer -> uh/d -> rf/b.a2(AIR_HEATER) = OperationModeAirHeater 3 + OperationModeCombined 1 (frame 3f3b017f1f3f); Stop -> j4 = Mode 0 (3f0b007f1f3f). Page status bar reads 'Inactive • Timer: HH:MM' only while armed. No confirm dialog on this path. calictl: timer_start / timer_cancel + semantics timer_armed. B0 APP-OBSERVED 2026-09-27 (screens 35-37): tapping the 'Start heating at' value opens a bottom-sheet hour/minute wheel; its OK writes the time at once, with no confirm, independent of Start timer (does not arm); 09:31 -> 3f7b007f091f (TimerHour@32=0x09, TimerMin@40=0x1f, every other field at its sentinel). Identical to calictl 'timer 09:31' (T_AIRHEATER_TIMER_TIME, tools/scenarios/airheater/timer-time.yaml)."
    evidence: DECOMPILE 5.4.0.3036 + APP-OBSERVED 2026-10-11 (thinky lab vs fake unit) + REAL PHONE 2026-10-11 (at the van) | APP-OBSERVED 2026-09-27 | APP-OBSERVED 2026-09-16 | DECOMPILE

  - id: permanentHeatingWidget
    type: toggle
    label_key: airHeaterPage_permanentHeatingWidget_permanentHeating_text
    range: null
    controls: {field: PermanentOperationRequest, action: E3}
    elements:
      - canOnlyBeActivated_text
    constraints: "OFF-only switch from the app: E3 writes PermanentOperationRequest=0; NO ON write site exists in rf/b.java (re-confirmed 2026-09-16). ON is started from the in-vehicle controls; the app's ON tap raises permanentHeatingOnDialog ('can only be activated in the vehicle' — infoPage_heating_permanent_description says the same). RESOLVED 2026-10-11 (lab + real phone): while off, the whole card is clickable and opens the info sheet 'Continuous heating can be initiated only in the vehicle. / This feature can be disabled from the mobile app, but it can be activated only using the in-vehicle systems.' [Got it] — no write; the light-grey switch (REAL-PHONE 2026-10-10) is only its look. calictl mirrors OFF-only (control._airheater 'permanent', web switch greyed with the same reason)."
    evidence: DECOMPILE 5.4.0.3036 + APP-OBSERVED 2026-10-11 (thinky lab vs fake unit) + REAL PHONE 2026-10-11 (at the van)

  - id: permanentHeatingOnDialog
    type: drawer
    label_key: airHeaterPage_permanentHeatingOnDialog_permanentHeatingCanOnlyBeActivated_text
    range: null
    controls: null
    elements:
      - thisFeatureCanBeDisabled_text
    constraints: "Info sheet (no confirm action, no write) opened by tapping the permanentHeatingWidget card while continuous heating is off: 'Continuous heating can be initiated only in the vehicle.' (2026-10-11, lab + real phone)"

  - id: permanentHeatingOffDialog
    type: drawer
    label_key: airHeaterPage_permanentHeatingOffDialog_turnOffPermanentHeating_text
    range: null
    controls: {field: PermanentOperationRequest, action: E3}
    elements:
      - youCanOnlyTurnItBackOn_text
    constraints: "Confirm action writes PermanentOperationRequest=0 via E3"

  - id: permanentHeatingTimerDialog
    type: drawer
    label_key: airHeaterPage_permanentHeatingTimerDialog_doYouWantToProceed_text
    range: null
    controls: {field: "TimerHour/TimerMin", action: B0}
    elements:
      - permanentHeatingWillTurnOff_text
      - yesStartTimer_button
    constraints: "Shown on 'Start timer' while continuous heating is on: 'Continuous heating will turn off when the timer ends. Would you like to proceed?' (2026-10-11). calictl: web confirm on timer_start."

  - id: applyDialog
    type: drawer
    label_key: airHeaterPage_applyDialog_applyNewSettingsNow_text
    range: null
    controls: {field: "HeatingLevel/RunningTime", action: "q4/D4"}
    elements:
      - runTimeWillBeReset_text
    constraints: "Shown on a runTimeSlider change while heating: 'Apply new settings now? Resetting the duration. The heating will stay on for N minutes.' Apply writes OFF, RunningTime, ON (3 frames, 2026-10-11) — calictl mirrors the prompt only and writes RunningTime alone (see runTimeSlider)."

  - id: statusBar
    type: readout
    label_key: airHeaterPage_statusBar_inactive_text
    range: null
    controls: null
    elements:
      - activePermHeating_text
      - activePermHeatingTimer_text
      - activeRemainingTimerStartTimer_text
      - activeRunTime_text
      - inactive_text
      - inactiveStartTimer_text
    constraints: "Read-only status line under the title. APP-OBSERVED 2026-09-27 (screen 34 variants): 'Inactive' (idle); 'Active • N min remaining' (NormalOperation=1, RunningTimeinAction=N); 'Active • Continuous heating' (PermanentOperation=1); 'Inactive • Timer: HH:MM' (OperationModeAirHeater=3 + OperationModeCombined=1). 2026-10-11 the two remaining keys: running + timer armed -> 'Active • Remaining time: N • Timer starts: HH:MM' (activeRemainingTimerStartTimer); permanent + timer armed -> 'Active • Continuous heating • Timer starts in HH:MM' (activePermHeatingTimer). calictl's summary mirrors all six."
    evidence: DECOMPILE 5.4.0.3036 + APP-OBSERVED 2026-10-11 (thinky lab vs fake unit) + REAL PHONE 2026-10-11 (at the van) | APP-OBSERVED 2026-09-27 | DECOMPILE

  - id: faultToasts
    type: dialog
    label_key: null
    label_text: "ErrorCode toasts (headline / body / OK)"
    range: null
    controls: null
    elements: []
    constraints: "Pops the moment 1702 ErrorCode changes, on any page. 1 Battery voltage too low; 2 'Low fuel' — 'The auxiliary air heater was switched off because the fuel level is low. It can only be activated again when there is sufficient fuel. Please refuel.' [OK] (APP-OBSERVED 2026-09-16, re-seen 2026-09-27 screen 34); 3 system fault; 4 Emission limit exceeded; 5 deactivated. VERSION DRIFT app 5.4.0 (DECOMPILE ig/b.java:606-700, not app-observed): 6 'Auxiliary air heater deactivated due to engine running.' / DE 'Luftstandheizung durch Motorlauf deaktiviert.'; 7 'Auxiliary air heater deactivated due to activation of the auxiliary heater.' / DE 'Luftstandheizung deaktiviert durch Aktivierung der Standheizung.' (keys dialog_error_airHeater_deactivated_engine_text / _waterHeater_text). Full texts: docs/business-logic/cooler-airheater.md, alert-states.md §3."
    evidence: APP-OBSERVED 2026-09-27 | APP-OBSERVED 2026-09-16 | DECOMPILE 5.4.0 (codes 6/7)

  - id: nightReduction
    type: section
    label_key: airHeaterPage_continuousHeating_nightReduction_Title
    label_text: "Night reduction"   # DE 'Nachtabsenkung'
    range: null
    controls: null
    elements:
      - airHeaterPage_continuousHeating_nightReductionTemperatureSlider_text
      - airHeaterPage_continuousHeating_nightReduction_timerWidget_title_text
      - airHeaterPage_continuousHeating_nightReduction_timerWidget_title2_text
      - airHeaterPage_permanentHeatingDialog_nightReductionNo_title
      - infoPage_heating_nightReduction_headline
    constraints: "NEW in app 5.4.0, NOT on this van: shown only for a unit reporting CommunicationVersion >= 3 (or a California Next). Reads the V3 F001 night-reduction fields and writes char F002 (sg/b.java:56-70, tg/b.java:408-583): heating level + start/end time + Activated 2=on/1=off; the UI requires continuous heating on ('Cannot turn on Night reduction.'). A V2 unit (this van) never gets an F002 write; calictl must never send one. See docs/business-logic/protocol-alignment.md 'App 5.4.0'."
    evidence: DECOMPILE 5.4.0 (2026-10-10)

icons:
  - air_heater             # drawable/air_heater
  - air_heater02            # drawable/air_heater02
  - park_heater_continuous  # drawable/park_heater_continuous — likely the permanentHeatingWidget icon
  - heating_cooling_timer   # drawable/heating_cooling_timer — shared timer icon (also used by coolbox)

notes: |
  Widget-tree hierarchy inferred purely from the
  `airHeaterPage_<widget>_<element>_<type>` key structure (same method as
  coolbox.yaml) — the real @Composable functions are fully obfuscated in
  the decompiled output and carry no recoverable names.

  The screen's ViewModel (rf/b.java, class rf.b) implements BOTH we.b
  (this screen) and df.a (the separate combined livingRoomHeater screen),
  because both features are multiplexed over the same BLE control
  characteristic (1701/1702, class sf.a/sf.b — shared with the cooler
  function's 1101/1102 register layout). Of the df.a methods, a2
  (Start timer) and j4 (Stop) ARE this page's timer controls
  (APP-OBSERVED 2026-09-16, see timerWidget); B1, M1, b2 are not modeled.

  Enum we.a (package `we`) backing the H3 action has 3 members:
  FRONT_AND_REAR(0), FRONT(1), REAR(2) — mapped to AirDistribution values
  1/2/3. No airHeaterPage_* string key surfaces this control, so either
  it's not exposed on this screen/vehicle variant, or it's controlled via
  a settings surface not captured by this key harvest.

  Enum df.b (7 members: AIR_HEATER, TRUMA_HEATER, ROOF_AIR_CONDITION, and
  4 combinations) backs the df.a-only `a2` action — this is almost
  certainly the HeaterPage_livingRoomHeatingWidget energy-source picker
  (6A/10A/diesel/gas/mix6A/mix10A keys), not part of air-heater.yaml.
