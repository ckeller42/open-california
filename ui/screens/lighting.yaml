    controls: {field: ProfileNumber, action: "SET_BRIGHTNESS (save, long-press) / SET_PROFILE (apply)"}
    elements: [lighting_pleasePressAndHold_headline, lighting_pleasePressAndHold_text]
    constraints: "APP-OBSERVED 2026-09-27 (screens 20, 32): four profile tiles A-D under 'All lights', each with a '+' while empty. A SHORT tap shows 'Please press and hold' — 'To save or change lighting settings, press and hold the profile button until you see a confirmation.' [OK]; press-and-hold saves. Tile A long-press = ProfileNumber 1 save frame (APP-RECORDED 2026-10-05, lighting-profile.jsonl; = calictl save_profile 1). Activate (short tap on a stored tile) = dg/h.u0 one SET_PROFILE frame PN N — APP-RECORDED 2026-10-06 (lighting-favourite.jsonl: tile A -> 0110..., = calictl profile 1). Right after a save the saved tile is the active one (radio indicator selected) and a tap on it writes nothing; tiles turn from '+' to filled from the REQUEST_CONFIG reply (also after a cold app restart). DECOMPILE (decompile cross-check 2026-10-06, enigma 46f982d3): tiles A/B/C/D = FAVORITE 1/5/6/7 (hi/f, gv/z0 case 26), drawn filled from FavoriteProfileModifiedState bits 0/4/5/6; activate is acked by any 1502 frame with PN == N, the save only by an exact Mode 4 / PN N frame (else 'Something went wrong'). Tiles B-D not yet recorded."
    evidence: APP-OBSERVED 2026-09-27 | APP-OBSERVED 2026-09-16

