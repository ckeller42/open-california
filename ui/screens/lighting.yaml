notes: >
  Richest of the three screens. Zone brightness sliders and the color picker are
  the only widgets with a confident protocol mapping (BrightnessLOne..OneSix /
  SET_BRIGHTNESS, LightValue / SET_COLOR, ProfileNumber / SET_PROFILE via control
  char 1501, eg/a.java). Command enum (dg_n): NO_MODE, PREVIEW, REQUEST_CONFIG,
  SET_BRIGHTNESS, SET_COLOR, SET_DOUBLE, SET_PROFILE, SYSTEM_TIME, WAKEUP_TIME —
  every one of these maps to a widget found here (PREVIEW->wake-up preview button,
  SET_DOUBLE->double-tap settings, SYSTEM_TIME/WAKEUP_TIME->wake-up timer).
  Section layout differs by vehicle generation (base/_t6/_gc suffixes); a replica
  GUI should probably pick one generation's layout (recommend _gc, most complete)
  rather than union all sections. Zone-index-to-BrightnessL* mapping still needs
  live traffic capture to verify (see dictionary.yaml control_models_unresolved).
