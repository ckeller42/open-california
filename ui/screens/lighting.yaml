# Extracted from VW CaliforniaOnTour app decompile (string-key harvest).
# Deep link route observed: californiaontour://app/vehicle/lighting
# Key families (variant suffixes reflect different camper generations sharing
# one screen implementation with per-model zone layouts):
#   <no suffix>   = base / T6.1 Multivan-style layout (outerLights, kitchen)
#   _t6           = "T6" layout (livingArea, popupRoof, rear sections)
#   _gc           = "Grand California" layout (interiorLighting, readingLights,
#                   exteriorLight sections; also the only variant with the
#                   wake-up-light colour picker)
# All zone brightness sliders map to the 16-zone BrightnessLOne..BrightnessLOneSix
# control fields (control char 1501, source eg/a.java); order of the 16 zones to
# vehicle areas is UNVERIFIED (needs live-traffic capture to confirm which zone
# index corresponds to which named area, per generation).
screen: lighting
title_key: lighting_pageTitle_lighting_text
function: lighting  # service 1500/1502, control 1501 (eg/a.java) — see dictionary control_models_unresolved
widgets:
  - id: pageHeader
    type: label
    label_key: lighting_pageTitle_lighting_text
    range: null
    controls: null
    elements: [lighting_pageTitle, lighting_headline, lighting_text]
    constraints: null

  - id: allLightsToggle
    type: toggle
    label_key: lighting_mainSection_allLights_text
    range: null
    controls: {field: null, action: null}
    elements: null
    constraints: "Convenience toggle; likely fans out to all 16 BrightnessL* fields at once rather than a single dictionary field. UNVERIFIED."

  - id: profileSelector
    type: drawer
    label_key: lighting_mainSection_profile_text
    range: "0..63"
    controls: {field: ProfileNumber, action: SET_PROFILE}
    elements: [LIGHTING_PROFILE_EMPTY_DIALOG, lighting_noAreaChosen_headline, lighting_noAreaChosen_text]
    constraints: "ProfileNumber is a 4-bit field (offset 4, width 4). The eg/a.java `sg.a(14, 6)` was misread: 14 is the initial VALUE, 6 is the type code = 4-bit width (matches dictionary.yaml). Profiles 0-14 (dg/l.java): 0=LIGHTS_OFF, 1-7=FAVORITE, 8=DOOR_CONTACT, 9=LIVE_VIEW, 10=WAKEUP_LIGHT, 11=INTERIOR_LIGHT, 12=LIGHTS_ON, 13=DEFAULT, 14=INIT. NOTE a SET_BRIGHTNESS frame must ECHO the currently-active ProfileNumber read from 1502, not 0 (re-gap §A1)."

