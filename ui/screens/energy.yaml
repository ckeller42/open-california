# Extracted from VW CaliforniaOnTour app decompile (string-key harvest).
# No dedicated "energyPage_*" key family exists; the live energy/battery detail
# screen reuses a generic "infoPage_*" prefix (pageHeadline/sectionHeadline/
# listItem/statusBar/value_text), shared with an unrelated "Vehicle Information"
# detail screen and with onboarding tooltip pages — disambiguated below by
# grouping only the battery/charging-relevant keys. A compact summary tile
# (vehiclePage_overviewWidget_secondBattery_*) lives on the main vehicle
# dashboard and links into this detail screen via "seeAllInfo".
# APP-OBSERVED 2026-09-27 (app 5.0.8.3028 vs the fake unit, inventory screens
# 01-02, 09-10, 58-59): this detail screen IS the page titled "Vehicle
# Information" (Status: Fresh water / Waste water / Vehicle Battery / Second
# battery; Charging (i); Energy Mode; Shore power; Vehicle Power). The
# "howToAndInfo" title in vehicle-info.yaml is the separate Help page.
screen: energy
title_key: infoPage_pageHeadline_vehicleBattery_text
function: energy  # service 1600/1602, control char 1601 (pg/a.java) — state telemetry only, control_fields largely MERGED_AMBIGUOUS/UNVERIFIED
widgets:
  - id: dashboardSummaryTile
    type: readout
    label_key: vehiclePage_overviewWidget_secondBattery_text
    range: null
    controls: {field: null, action: null}
    elements:
      - vehiclePage_overviewWidget_secondBattery_via_text
      - vehiclePage_overviewWidget_secondBattery_externalPowerSource_text
      - vehiclePage_overviewWidget_secondBattery_solarPower_text
      - vehiclePage_overviewWidget_secondBattery_vehiclePower_text
      - vehiclePage_overviewWidget_seeAllInfo_text
      - vehiclePage_overviewWidget_allInfos_issues_text
    label_text: Second battery
    constraints: "Compact dashboard row. APP-OBSERVED 2026-09-27 (screens 03-05): 'Second battery  100% • 14 h' = '<soc2 %> • <remaining h>' (the key-name reading '<battery %> via <source>' was not what this build shows). 'See all info' navigates to this detail screen."
    evidence: APP-OBSERVED 2026-09-27 | DECOMPILE

  - id: energyDurationFormat
    type: label
    label_key: vehiclePage_overviewWidget_energy_textHour_text
    range: null
    controls: null
    elements: [vehiclePage_overviewWidget_energy_textHour, vehiclePage_overviewWidget_energy_textMinute]
    constraints: "Hour/minute unit suffixes for a remaining-time-style readout (e.g. estimated charge time remaining)."

  - id: statusBar
    type: readout
    label_key: infoPage_sectionHeadline_status_text
    range: null
    controls: {field: null, action: null}
    elements: [infoPage_statusBar_active_text, infoPage_statusBar_inactive_text, infoPage_statusBar_ready_text]
    constraints: "Overall status text; derives from combination of state_fields below rather than one field directly."

  - id: batteryValue
    type: readout
    label_key: infoPage_battery_value_text
    range: null
    controls: {field: null, action: null}
    elements: null
    constraints: "APP-OBSERVED 2026-09-27 (screens 01-02): 'Second battery  100% • 14 h / 13.6 V • -3.9 A'; the starter row reads 'Vehicle Battery  -- V • -- A' with no % when there is no data. Second/leisure battery readout: voltage and current (V • A), NOT a charge percentage. VERIFIED 2026-09-07 against the view-model: UTwoBattBemAfs ÷ 10 → V and ITwoBattBemAfs ÷ 10 → A (xf/d.java:159, binding xf/a.java:154); both from the energy service (1600), see protocol/signals.yaml batt2_v / batt2_current."

  - id: chargingSection
    type: section
    label_key: infoPage_sectionHeadline_charging_text
    range: null
    controls: null
    elements: [infoPage_charging_value_text]
    constraints: "The Charging row carries an (i) icon that opens chargingInfoSheet (APP-OBSERVED 2026-09-27)."

  - id: chargingInfoSheet
    type: drawer
    label_key: null
    label_text: Charging
    range: null
    controls: null
    elements: []
    constraints: "Bottom sheet from the Charging (i) (APP-OBSERVED 2026-09-27, screen 09): explains that Max energy mode charges the second battery as fast as possible while driving by raising the engine idle speed, which can increase fuel consumption; link 'Online manual'; button 'Got it'."
    evidence: APP-OBSERVED 2026-09-27

  - id: energyModeSelector
    type: toggle
    label_key: infoPage_listItem_energyMode_text
    range: "0..3 (2-bit OperationMode field, offset MERGED_AMBIGUOUS)"
    controls: {field: OperationMode, action: null}
    elements: [energyMode_eco_text, energyMode_max_text, energyMode_normal_text, energyMode_text]
    constraints: "Chevron row 'Energy Mode: Normal' expanding to an inline radio group. Normal / Max ALWAYS; ECO only when zj/c.N0 is true — DECOMPILE-VERIFIED (ak/a.java:712-716: ak/a.b reads N0 and conditionally prepends bf.c.X ECO_MODE); the SOURCE of N0 (account/config vs vehicle) is unresolved, next step a SootUp def-use trace of N0's writer. APP-OBSERVED 2026-09-27 (screens 58-59): ECO absent with EnergyModeNotSelectable=0, PvInstalled=1 and CarVariant=2 alike. EnergyModeNotSelectable is decoded but never read by any UI (dead). Max frame 10 -> 30 APP-OBSERVED 2026-09-16."
    evidence: APP-OBSERVED 2026-09-27 | APP-OBSERVED 2026-09-16 | DECOMPILE

  - id: vehicleInfoListItems
    type: section
    label_key: null
    range: null
    controls: null
    elements:
      - infoPage_listItem_campsitePowerSupply_text
      - infoPage_listItem_energyMode_text
      - infoPage_listItem_outsideTemperature_text
      - infoPage_listItem_solarPower_text
      - infoPage_listItem_vehiclePower_text
    constraints: "Row list shown under both the 'Vehicle Battery' and 'Vehicle Information' infoPage headlines; campsitePowerSupply/solarPower/vehiclePower are the three energy-source rows, energyMode/outsideTemperature are shared vehicle-status rows."

  - id: outsideTemperature
    type: readout
    label_key: infoPage_outsideTemperature_value_text
    range: null
    controls: {field: null, action: null}
    elements: [infoPage_subline_outsideTemperature_text]
    constraints: "Not an energy field per se, but co-displayed on the same vehicle-status list as energy source rows. Not shown on the Ocean profile in 5.0.8.3028 (APP-OBSERVED 2026-09-27); the Shore power row reads '0.0 W • 0.0 A' + 'Inactive', then a 'Vehicle Power' row."

  - id: batteryWarningDialogs
    type: label
    label_key: infoPage_pageHeadline_vehicleBattery_text
    range: null
    controls: null
    elements:
      - energy_additionalBatteryChargingRequired_headline
      - energy_additionalBatteryChargingRequired_text
      - energy_additionalBatteryDeepDischarge_headline
      - energy_additionalBatteryDeepDischarge_text
      - energy_batteryFlat_headline
      - energy_batteryFlat_text
      - energy_batteryNotCharging_headline
      - energy_batteryNotCharging_text
      - energy_secondBattery_headline
      - energy_secondBattery_text
      - energy_secondBatteryAlmostEmpty_headline
      - energy_secondBatteryAlmostEmpty_text
    constraints: "Battery-fault banners/dialogs. Field mapping (UNVERIFIED but plausible by name match): batteryNotCharging/secondBattery* -> TwoBattNotCharged (offset 7) / WarningLevelActive (offset 4) / WarningLevelTwo state bits."

  - id: chargingWarningDialogs
    type: label
    label_key: null  # multi-string dialog group, no single label of its own (matches
                      # vehicleInfoListItems/acknowledgeableFaultToasts below, which are
                      # the same kind of container and already use null); it previously
                      # borrowed the chargingSection widget's own label_key, which made
                      # the two widgets collide on the identical displayed label "Charging"
    range: null
    controls: null
    elements:
      - energy_chargingCableStillInVehicle_headline
      - energy_chargingCableStillInVehicle_text
      - energy_chargingLimited_headline
      - energy_chargingLimited_text
      - energy_chargingRestricted_headline
      - energy_chargingRestricted_text
      - energy_externalPowerSourceNotFunctioning_headline
      - energy_externalPowerSourceNotFunctioning_text
      - energy_externalPowerSourceUnavailable_headline
      - energy_externalPowerSourceUnavailable_text
      - energy_solarInverterNotWorking_headline
      - energy_solarInverterNotWorking_text
    constraints: "externalPowerSource dialogs map to LandDefect (offset 1) / LandNotAvailable (offset 0) state bits ('Land' = shore/land power in source). solarInverterNotWorking maps to PvDefect (offset 15)."

  - id: acknowledgeableFaultToasts
    type: button
    label_key: null
    range: null
    controls: {field: null, action: null}
    elements:
      - {key: energyCurrentDeratingTemperatureConfirmed, field: CurrentDeratingTemperature}
      - {key: energyDcDcDefectConfirmed, field: DcdcDefect}
      - {key: energyPhotovoltaicsDefectConfirmed, field: PvDefect}
      - {key: energySecondBatteryNotChargedConfirmed, field: TwoBattNotCharged}
      - {key: energySecondBatterySwitchAtChargingConfirmed, field: TwoBattSwitchAtCharging}
      - {key: energySecondBatterySwitchAtWorkshopConfirmed, field: TwoBattSwitchAtWorkshop}
      - {key: energySecondBatteryWarnLevelTwoConfirmed, field: WarningLevelTwo}
      - {key: energyShorePowerDefectConfirmed, field: LandDefect}
      - {key: energyShorePowerNotAvailableConfirmed, field: LandNotAvailable}
      - {key: energySystemErrorConfirmed, field: SystemError}
    constraints: "Direct 1:1 name-to-field mapping confirmed by naming convention; each is a user 'acknowledge this fault' confirmation action, one per service-1600 state_field warning bit (dictionary.yaml functions.energy.state_fields)."

icons:
  - vehicle_status_charging
  - vehicle_status_shore_power
  - vehicle_status_solar
  - vehiclepower
  - vehicle_and_charging_options

notes: >
  Read-only telemetry screen (service 1600/1602 state_fields are all fault/warning
  bits plus a handful of install-flags; no control_fields beyond an ambiguous
  OperationMode). Every energy*Confirmed acknowledgement string has an exact
  1:1 name match to a dictionary.yaml state_field, giving high confidence there;
  the live numeric battery-percentage / charging-value readouts (infoPage_battery_
  value_text, infoPage_charging_value_text) have no obvious dictionary field and
  are flagged UNVERIFIED — likely sourced from a different/general service not
  yet mapped. No energy-specific icon set beyond the three vehicle_status_* +
  vehiclepower source icons was found in the connectivity_ui module.
