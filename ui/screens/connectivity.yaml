  - id: connectionStateReadout
    type: readout
    label_key: null
    range: null
    controls: null
    elements: [connection_searching, connection_error, connection_success, connection_ignition]
    constraints: "Inferred purely from drawable names (connection_searching/_error/_success/_ignition/_bt_background/_all_models/_cabe/_connecting/_smartphone/_wifi_bt_button); no matching string keys found to pair with each state"
icons:
