      - vinFlow_secondaryButton_later_button
      - vinFlow_disabledButton_save_button
      - vinFlow_primaryButton_setUpRemoteControl_button
      - vinFlow_subline_youCanAlsoSetUp_text
      - vinFlow_headline_yourVehicleHasBeenAdded_text
