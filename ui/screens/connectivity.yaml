notes: >
  BluetoothLowEnergyConnectionService.java (com/californiaontour/connectivity/bluetooth/)
  is the actual BLE transport implementation referenced by dictionary.yaml's
  control_source files (sf/a.java, lg/a.java, gg/a.java, pg/a.java all write
  through this service) — out of scope for a GUI spec but worth noting as the
  file to check for the real connect/disconnect state machine if replicating
  behavior, not just layout.
