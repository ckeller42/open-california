# BLE/WiFi pairing, connection troubleshooting, and add-vehicle (VIN) flows.
# Cross-cutting: reachable from home.yaml (connectHeader / vehicleNotEnrolledTile),
# account.yaml (myCaliforniaNav bluetooth/wifi reset entries), and onboarding.
# Nav destination: NavigationAccount$ConnectivitySettingsScreen covers the
# *settings toggle* (see settings.yaml); this file covers the *pairing wizard*
# screens, which are not exposed as their own NavigationConnectivity$*Screen
# nav-route stubs (no dedicated route class found) — reconstructed purely
# from string-key prefixes: vinFlow_*, bluetoothReset_*, wifiReset_*,
# setUpRemoteControl_*.
screen: connectivity
title_key: vinFlow_drawerTitle_addVehicle_text
function: null
widgets:
  - id: vinFlowInput
    type: drawer
    label_key: vinFlow_headline_beginYourAdventure_text
    range: null
    controls: null
    elements:
      - vinFlow_listInput_myVin_text
      - vinFlow_inputSubLine_unsupportedCharacter_text
      - vinFlow_listInput_selectModel_text
      - vinFlow_listInputSubline_selectTheModel_text
      - vinFlow_listInput_selectEdition_text
      - vinFlow_listInputSubline_selectTheEdition_text
      - vinFlow_modelDisplay_model_text
    constraints: "VIN entry + model/edition disambiguation"

  - id: vinFlowDescription
    type: label
    label_key: vinFlow_description_toCheckTheVehicleStatus_text
    range: null
    controls: null
    elements:
