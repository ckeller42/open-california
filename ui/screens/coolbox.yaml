notes: |
  Screen composed from two parallel Java resource-accessor classes in the
  decompiled sources (ea/* and x9/* packages define the same key set twice —
  likely two build variants/targets, e.g. phone vs. t6/t6.1 vehicle line, or
  a widget/preview duplicate). Only the key NAMES were used to reconstruct
  the widget tree per the task's method; the localized text itself lives in
  byte-offset-addressed values-en/*.cvr resource blobs and was not needed.

  Widget-tree hierarchy inferred purely from the `<screen>Page_<widget>_<element>_<type>`
  key structure — there is no separately-recoverable Compose UI tree in the
  decompiled output (the actual @Composable functions are fully obfuscated,
  single-letter classes with no meaningful names; only the shared resource
  accessor classes and the ViewModel (vf/c.java) retain readable identifiers).

  ViewModel class vf.c (package vf) is the single source of truth for the
  interactive control surface: it implements interface af.a with literal
  one/two-character method names (U0, X1, f, D, X0, y0, c0, Y2, plus several
  StateFlow getters D3/H/I1/J0/P1/P2/f2/g1/h0/k4/l2/t2/v0/z1/X3/d3/b4) backed
  by a shared bit-packed register class sf.b — the SAME register class is
  reused for the airheater screen (rf/b.java) with different field bindings
  at the same bit offsets, which is exactly what protocol/dictionary.yaml
  flags as "MERGED_AMBIGUOUS" offsets.

  quietModeWidget's Mode values are settled: 0 = off, 2 = manual, 4 =
  automatic/scheduled — DEVICE-verified 2026-08-26 (the unit's own
  Flüstermodus screen) and APP-OBSERVED 2026-09-16 (manual ff271e3e1f1f,
  automatic ff471e3e1f1f).
