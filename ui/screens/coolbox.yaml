# Coolbox (fridge) screen — extracted from decompiled CaliforniaOnTour app.
# Source: string-resource KEYS harvested from the resource-accessor classes
#   ea/d.java, ea/i.java, ea/j.java, x9/l0.java, x9/p0.java, x9/q0.java
#   (all pure StringResource lazy-getters keyed "string:<key>" — no widget
#   logic lives there, only the KEY NAMES, which is all we need).
# Protocol/action linkage cross-referenced against:
#   - protocol/dictionary.yaml -> functions.cooler (state_services [1100,1102],
#     control_source sf/a.java)
#   - vf/c.java — the Cooler screen ViewModel (implements interface af.a).
#     Action letters below are the LITERAL decompiled method names on that
#     class, confirmed by reading the method bodies:
#       U0(boolean, ...)      -> writes control bit "State" (power on/off)
#       X1(int, ...)          -> writes control field "Level" (1..5, clamped
#                                 in-app via `(1 > i || i >= 6) ? 1 : i`)
#       f(c, int) [static]    -> writes control field "Mode"; observed called
#                                 with 0 (T1/off), 2 (x0), 4 (k0) — mapped to
#                                 Off/Manual/TimerBased quiet-mode selection
#                                 (UNVERIFIED exact enum-to-int mapping)
#       D(fz.i)               -> writes control field "TimerStart" (=1)
#       X0(dz.c)              -> writes control field "TimerCancel" (=1)
#       y0(m, si.e)           -> writes control fields "TimerHour"+"TimerMin"
#                                 as a pair (m.f24999a=hour, m.f25000b=min)
#       c0(int, yh.b)         -> writes control field "NightTimerHourOn"
#       Y2(int, yh.b)         -> writes control field "NightTimerHourOff"
screen: coolbox
title_key: coolboxPage_pageTitle_coolbox_text
function: cooler
