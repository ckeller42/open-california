    type: label
    label_key: null
    label_text: "Opening front door activates the exterior and interior lighting at the front."
    range: null
    controls: {field: OutsideLight, action: X1}
    elements: null
    constraints: >
      tf/a.java:110-121 K0(boolean on) sets BOTH OutsideLight AND
      InteriorLight together (no independent per-light control exists in
