# docs/business-logic/climate-stairs.md ("Campingmode" section) —
# authoritative source for exact BLE recipes; this file is the GUI-shape
# summary of it.
# Service 0x1200, control char 0x1201, state char 0x1202. Control model is
# the SAME shared class (lg.a/lg.b) used by roofaircondition, differentiated
# by constructor path (tf/a.java:74, using the (jn.b, tf.a, xm.a) overload of
# lg/a.java:26-34). Feature ViewModel tf/a.java implements xe.a.
