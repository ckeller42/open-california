name: docs
# Build the Sphinx docs (API + requirement traceability + protocol sequence diagrams) and
# publish them to GitHub Pages: https://ckeller42.github.io/open-california/

on:
  push:
    branches: [main]
    paths:
      - 'docs/sphinx/**'
      - 'calictl/**'
      - 'tests/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install doc toolchain
        run: pip install -r docs/sphinx/requirements.txt
      - name: Build HTML (warnings are errors)
        run: python -m sphinx -b html -W docs/sphinx docs/sphinx/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sphinx/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
