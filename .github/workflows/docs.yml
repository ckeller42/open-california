name: docs
# Build the Sphinx docs (API + requirement traceability + protocol sequence diagrams) and
# publish them to GitHub Pages: https://ckeller42.github.io/open-california/

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'ARCHITECTURE.md'   # included into the site via the docs/architecture.md stub
      - 'calictl/**'
      - 'tests/**'
      - 'tools/gen_c_dict.py'        # automodule'd in docs/api.rst
      - 'tools/gen_codec_vectors.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install doc toolchain
        run: pip install -r docs/requirements.txt
      - name: Build HTML (warnings are errors)
        run: sh docs/build_site.sh docs/_build/html   # product docs + the separate evidence build, merged
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
