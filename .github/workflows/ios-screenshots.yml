name: iOS screenshots

# Re-render the iOS app's docs screenshots (the "Screens" section of docs/ios-app.md) from the mock
# fixtures whenever the app changes on main, and publish them to the screenshots branch — main is
# ruleset-protected, so docs.yml lays that branch's PNGs over main before building the site. This is
# the same render as tools/ios_gallery.sh, on the xcode-27 runner so it matches the snapshot toolchain.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "tools/ios_gallery.sh"
  workflow_dispatch:

permissions: {}

# Share the screenshots branch (and so this group) with the web Screenshots workflow: one concurrency
# group serializes the pushes to that branch. NEVER cancel mid-run — the publish job pushes.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Render with a read-only token: this job builds the app and runs the simulator.
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      IOS_SIM_NAME: iPhone 17
      IOS_SIM_OS: "27.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen 2.46.0 (release binary, SHA-256 checked)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          shasum -a 256 -c <<'SUMS'
          4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip
          SUMS
          unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Render the gallery over the mock unit
        run: tools/ios_gallery.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-shots
          path: docs/screenshots/ios/*.png
          retention-days: 1

  # main is ruleset-protected (PRs only), so the shots live on the screenshots branch: docs.yml lays
  # them over main before building. Only this job holds write scopes, and it runs nothing but git + gh
  # on the rendered PNGs.
  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the screenshots branch
      actions: write    # start docs.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true  # zizmor: ignore[artipacked] -- the publish step pushes with this token
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-shots
          path: ${{ runner.temp }}/ios-shots
      - name: Commit refreshed iOS screenshots to the screenshots branch (if any changed)
        id: push
        run: |
          w="$RUNNER_TEMP/branch"
          if git fetch -q origin screenshots; then
            git worktree add -q "$w" FETCH_HEAD
          else
            git worktree add -q --detach "$w" && git -C "$w" checkout -q --orphan screenshots && git -C "$w" rm -rqf .
          fi
          mkdir -p "$w/docs/screenshots/ios" && cp "$RUNNER_TEMP"/ios-shots/*.png "$w/docs/screenshots/ios/"
          cd "$w"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/ios
          if git diff --cached --quiet; then
            echo "no screenshot changes"
          else
            git commit -qm "docs: refresh iOS screenshots"
            git push -q origin HEAD:screenshots
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the docs site with the new shots
        if: steps.push.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main -R "$GITHUB_REPOSITORY"
