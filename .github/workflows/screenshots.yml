name: Screenshots

# Render the web-UI screenshots (over the mock unit) + the ESP32 WiFi setup + recovery pages (from fixtures) whenever the UI changes on main, and commit
# them back, so the README + Sphinx docs always show the current build. The [skip ci] on the
# commit prevents a re-trigger loop; the paths filter keeps it from running on unrelated pushes.
on:
  push:
    branches: [main]
    paths:
      - "calictl/webui/**"
      - "calictl/semantics.py"
      - "tools/ux_gallery.py"
      - "tools/mock_unit.py"
      - "firmware/web/index_gen.html"   # the ESP recovery-page shot (ux_gallery's EspStub serves it)
  workflow_dispatch:

permissions: {}

# Serialize screenshot runs but NEVER cancel mid-run — this job commits + pushes, and a cancelled
# push can corrupt the working ref.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Render with a read-only token: this job runs pip + Playwright (third-party code).
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - name: Install Playwright
        run: pip install -r requirements-e2e.txt
      - name: Playwright version (for the browser cache key)
        run: echo "PW_VERSION=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PW_VERSION }}
      - name: Install Chromium (browser from cache when present)
        run: python -m playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}
      - name: Render the web UI over the mock unit
        run: python -m tools.ux_gallery --out "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 1

  # main is ruleset-protected (PRs only), so the shots live on their own `screenshots` branch: the
  # README links them there and docs.yml lays them over main's copies before building. Only this
  # job holds write scopes, and it runs nothing but git + gh on the rendered PNGs.
  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the screenshots branch
      actions: write    # start docs.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials stays at its default (true) ON PURPOSE: this job pushes with it.
        with:
          persist-credentials: true  # zizmor: ignore[artipacked] -- the publish step pushes with this token
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shots
          path: ${{ runner.temp }}/shots
      - name: Commit refreshed screenshots to the screenshots branch (if any changed)
        id: push
        run: |
          w="$RUNNER_TEMP/branch"
          if git fetch -q origin screenshots; then
            git worktree add -q "$w" FETCH_HEAD
          else
            git worktree add -q --detach "$w" && git -C "$w" checkout -q --orphan screenshots && git -C "$w" rm -rqf .
          fi
          mkdir -p "$w/docs/screenshots" && cp "$RUNNER_TEMP"/shots/*.png "$w/docs/screenshots/"
          cd "$w"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "no screenshot changes"
          else
            git commit -qm "docs: refresh web-UI screenshots"
            git push -q origin HEAD:screenshots
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the docs site with the new shots
        if: steps.push.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main -R "$GITHUB_REPOSITORY"
