name: Screenshots

# Render the web-UI screenshots (over the mock unit) + the ESP32 firmware page (from fixtures) whenever the UI changes on main, and commit
# them back, so the README + Sphinx docs always show the current build. The [skip ci] on the
# commit prevents a re-trigger loop; the paths filter keeps it from running on unrelated pushes.
on:
  push:
    branches: [main]
    paths:
      - "calictl/webui/**"
      - "calictl/semantics.py"
      - "tools/ux_gallery.py"
      - "tools/mock_unit.py"
      - "firmware/web/index_gen.html"   # the ESP page shots (ux_gallery's EspStub serves it)
  workflow_dispatch:

permissions:
  contents: write

# Serialize screenshot runs but NEVER cancel mid-run — this job commits + pushes, and a cancelled
# push can corrupt the working ref.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - name: Install Playwright
        run: pip install -r requirements-e2e.txt
      - name: Playwright version (for the browser cache key)
        run: echo "PW_VERSION=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PW_VERSION }}
      - name: Install Chromium (browser from cache when present)
        run: python -m playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}
      - name: Render the web UI over the mock unit
        run: python -m tools.ux_gallery --out docs/screenshots
      - name: Commit refreshed screenshots (if any changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "no screenshot changes"
          else
            git commit -m "docs: refresh web-UI screenshots [skip ci]"
            git push
          fi
