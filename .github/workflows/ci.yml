name: CI

on:
  push:
    branches: [main, vwcamper-control]
  pull_request:

# Cancel superseded runs on the same ref (rapid pushes stop paying for old commits). Read-only
# jobs, so cancelling mid-run is safe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no CI job writes to the repo (the screenshots workflow keeps its own write scope).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor 3.11 (3.9/3.10 are EOL); 3.13 is what buspi (the deploy target) runs.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test/tooling deps (runtime is stdlib-only)
        run: pip install -r requirements-dev.txt
      - name: Test suite (parallel; conftest isolates state per-test so it's xdist-safe)
        # Tests marked linux_only (tests/firmware: the NimBLE host e2e + bond store) need a 32-bit
        # toolchain + a NimBLE build: their own job (firmware-host-e2e). The rest of tests/firmware
        # (the pure-C SM parity, runner and session fakes) has no BLE dependency and runs here too.
        run: python -m pytest tests/ -q -n auto --dist loadgroup -m "not linux_only"
      # The next three checks are Python-version-independent -> run once (on the deploy target 3.13)
      # instead of 3x. The import-cleanliness guard stays on ALL versions (a stdlib layout can differ).
      - name: Signal-coverage + semantic-review audit
        if: matrix.python == '3.13'
        run: python -m tools.audit_signals --report
      - name: Web assets are fresh (screens.json == build_web output)
        if: matrix.python == '3.13'
        run: |
          python -m tools.build_web --out /tmp/screens.json
          diff -q /tmp/screens.json calictl/webui/screens.json \
            || { echo "::error::screens.json stale — run python -m tools.build_web"; exit 1; }
      - name: Runtime is stdlib-only at import
        run: python -m tools.check_import_clean   # shared with tools/ci.sh + the pre-commit hook

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff lint (config in pyproject.toml)
        run: python -m ruff check .
      # The web UI is hand-authored JS served client-side — no build, so nothing compiles it. A
      # ReferenceError (an undeclared identifier) once shipped to the Pi because `node --check`
      # only parses and the e2e mock hadn't rendered that screen. jsconfig.json has checkJs on:
      # `tsc` catches "Cannot find name" and the like statically. Hard gate, must stay at 0 errors.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: web UI typecheck (tsc --checkJs) + parse
        run: |
          npx --yes -p typescript tsc --noEmit -p calictl/webui/jsconfig.json
          node --check calictl/webui/app.js
          node --check calictl/webui/strings.de.js

  no-vendor-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed VW/vendor material or vehicle PII
        run: |
          set -e
          bad=$(git ls-files | grep -iE '\.(apk|xapk|dex|jar|aar|aab|cvr|pcap|pcapng|pklg|btsnoop)$|(^|/)decompile/|(^|/)manuals/|ui/assets/svg/' || true)
          if [ -n "$bad" ]; then echo "::error::vendor/binary material committed:"; echo "$bad"; exit 1; fi
          # real vehicle BLE MAC must not be committed (use a placeholder). Match by the
          # unit's OUI prefix + any suffix so this guard doesn't embed the full device MAC.
          if git grep -niE '20:81:9a(:[0-9a-f]{2}){3}' -- . ':!.github/' ':!.githooks/'; then
            echo "::error::real vehicle BLE MAC committed — use a placeholder / env var"; exit 1; fi
          # No committed VIN (PII). Mirrors the pre-commit hook: a 17-char VIN token AND a
          # WV2ZZZ/VIN context on the same line (WV2ZZZ is the generic VW world-manufacturer
          # prefix, safe to name; the owner's full VIN never appears in the repo).
          if git grep -nE '\b[A-HJ-NPR-Z0-9]{17}\b' -- . ':!.github/' ':!.githooks/' | grep -qiE 'WV2ZZZ|VIN'; then
            echo "::error::a VIN appears in a tracked file — VINs are PII, keep them out"; exit 1; fi
          echo "no vendor material, vehicle MAC, or VIN committed"

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint install.sh (POSIX syntax + shellcheck)
        run: |
          sh -n install.sh
          shellcheck install.sh

  # Python <-> C codec parity (issue #156): the generated header must be fresh and
  # every golden vector + the seeded fuzz pass must agree between calictl.protocol
  # and the host-compiled csrc/ codec. gcc is preinstalled on ubuntu-latest.
  codec-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Generated C headers are fresh (codec_dict.h + codec_chars.h + pairing_consts.h)
        run: python -m tools.gen_c_dict --check
      - name: Golden vectors are fresh
        run: python -m tools.gen_codec_vectors --check
      - name: Vectors + differential parity (compiles csrc/)
        run: python -m pytest tests/test_codec_vectors.py tests/test_gen_c_dict.py tests/test_codec_parity.py tests/test_ports_parity.py -q

  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - name: Install deps
        run: pip install -r requirements-e2e.txt
      - name: Playwright version (for the browser cache key)
        run: echo "PW_VERSION=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PW_VERSION }}
      - name: Install Chromium (browser from cache when present; apt --with-deps only on miss)
        run: python -m playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}
      - name: GUI end-to-end (web UI over the mock unit)
        run: python -m pytest tests/e2e -q

  pairing-real-stack:
    # calictl's real BluezTransport pairs with the fake unit over real BlueZ inside a VM (GitHub's
    # runner kernel has no Bluetooth). Not a required check until it has been reliably green.
    # No setup-python on purpose: the VM boots off the runner's root filesystem and runs the SYSTEM
    # python3, so vm.sh installs the rig's deps (bumble, bleak, dbus-fast) for that interpreter.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pair over real BlueZ in a VM
        run: bash tests/realstack/vm.sh

  firmware-host-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps
        # 32-bit toolchain: NimBLE's Linux port builds with -m32 (Mbed TLS is built from source, 32-bit)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
          pip install -r requirements-dev.txt
      - name: Host firmware e2e (NimBLE Linux port over TCP HCI to the Bumble fake unit)
        run: python -m pytest tests/firmware -v

  # The esp32s3 (M5Stack CoreS3) image: compile-only (no hardware in CI). Proves cali_core,
  # cali_ble_nimble (unchanged) and the NVS platform build against ESP-IDF's esp-nimble, with
  # codec_encode compiled out (the build fails if it reaches the ELF). Pin: firmware/README.md.
  firmware-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build esp32s3 image
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build
          { echo '```'; idf.py size; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json

  # The "chip simulator" tier (#154 Task 9): the esp32s3 image boots in Espressif's QEMU (pinned by
  # the IDF: tools/tools.json, esp-develop-9.2.2-20260417, in the same container). Its own variant
  # (qemu/sdkconfig.qemu: UART0 console, CONFIG_CALI_QEMU_PROBE = kvprobe command + no BT controller
  # init), built here and never uploaded, so the probe never ships; firmware-build's release image
  # fails its build if "kvprobe" reaches the ELF. Proves boot, the console line protocol on the
  # no-controller path, and NVS (the bond store) surviving a reboot. No Bluetooth in QEMU.
  firmware-qemu:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build the QEMU probe variant
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build-qemu -D SDKCONFIG=build-qemu/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;qemu/sdkconfig.qemu" build
      - name: Boot in QEMU + NVS persistence
        run: |
          . $IDF_PATH/export.sh
          pip install pytest
          CALI_QEMU=1 python -m pytest tests/firmware/test_qemu_boot.py -v
