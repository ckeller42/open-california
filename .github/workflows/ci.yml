name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (rapid pushes stop paying for old commits). Read-only
# jobs, so cancelling mid-run is safe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no CI job writes to the repo (the screenshots workflow keeps its own write scope).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor 3.11 (3.9/3.10 are EOL); 3.13 is what buspi (the deploy target) runs.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test/tooling deps (runtime is stdlib-only)
        run: pip install -r requirements-dev.txt
      - name: Test suite (parallel; conftest isolates state per-test so it's xdist-safe)
        # Tests marked linux_only (tests/firmware: the NimBLE host e2e + bond store) need a 32-bit
        # toolchain + a NimBLE build: their own job (firmware-host-e2e). The rest of tests/firmware
        # (the pure-C SM parity, runner and session fakes) has no BLE dependency and runs here too.
        run: python -m pytest tests/ -q -n auto --dist loadgroup -m "not linux_only"
      # The next three checks are Python-version-independent -> run once (on the deploy target 3.13)
      # instead of 3x. The import-cleanliness guard stays on ALL versions (a stdlib layout can differ).
      - name: Signal-coverage + semantic-review audit
        if: matrix.python == '3.13'
        run: python -m tools.audit_signals --report
      - name: Web assets are fresh (screens.json == build_web output)
        if: matrix.python == '3.13'
        run: |
          python -m tools.build_web --out /tmp/screens.json
          diff -q /tmp/screens.json calictl/webui/screens.json \
            || { echo "::error::screens.json stale — run python -m tools.build_web"; exit 1; }
      - name: Runtime is stdlib-only at import
        run: python -m tools.check_import_clean   # shared with tools/ci.sh + the import-clean pre-commit hook

  # Every pre-commit-stage hook in .pre-commit-config.yaml over the whole tree (ruff + ruff format,
  # markdownlint, gitleaks, whitespace/YAML, the vendor/MAC/VIN guard, import-clean, doc-offset,
  # screens.json + codec freshness, and the web-UI tsc --checkJs gate — the web UI is un-built JS,
  # so that is its only static check; a ReferenceError once shipped to the Pi without it). The
  # repo-local hooks run via tools/ci.sh (need the dev deps + node); tool versions are pinned in the
  # config, so this job, the local hooks and `tools/ci.sh lint` cannot drift apart.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit (all files)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: mypy type check (calictl/)
        run: python -m mypy calictl/
      - name: gitleaks over the working tree (the commit hook only scans staged changes)
        run: pre-commit run --hook-stage manual gitleaks-dir --all-files

  no-vendor-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse committed VW/vendor material or vehicle PII
        # Whole tracked tree: vendor paths, the real vehicle BLE MAC (matched by OUI prefix), VINs.
        # Same script as the `vendor-material` pre-commit hook and `tools/ci.sh vendor-check`.
        run: python3 tools/check_vendor_material.py --all

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint install.sh (POSIX syntax + shellcheck)
        run: |
          sh -n install.sh
          shellcheck install.sh

  # The Sphinx site (product docs + the evidence build, `-W`) on every PR, so a broken `:links:`,
  # cross-reference or toctree fails before merge. docs.yml runs the same build on main and deploys.
  docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install doc toolchain
        run: pip install -r docs/requirements.txt
      - name: Build the site (warnings are errors)
        run: sh docs/build_site.sh docs/_build/html

  # Python <-> C codec parity (issue #156): the generated header must be fresh and
  # every golden vector + the seeded fuzz pass must agree between calictl.protocol
  # and the host-compiled csrc/ codec. gcc is preinstalled on ubuntu-latest.
  codec-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Generated artifacts are fresh (csrc/ codec_dict.h + codec_chars.h + pairing_consts.h + net_consts.h + control_consts.h, firmware/web/ strings_gen.h + index_gen.html + app_bundle_gen.h)
        run: python -m tools.gen_c_dict --check
      - name: Golden vectors are fresh
        run: python -m tools.gen_codec_vectors --check
      - name: WiFi SM golden vectors are fresh (tools/wifi_sm_ref.py -> tests/vectors/wifi_sm.json)
        run: python -m tools.gen_wifi_vectors --check
      - name: Semantics golden vectors are fresh (calictl/semantics.py -> tests/vectors/semantics.json)
        run: python -m tools.gen_semantics_vectors --check
      - name: ESP control vectors are fresh (calictl/control.py -> tests/vectors/control.json)
        run: python -m tools.gen_control_vectors --check
      - name: Vectors + differential parity (compiles csrc/)
        run: python -m pytest tests/test_codec_vectors.py tests/test_gen_c_dict.py tests/test_codec_parity.py tests/test_ports_parity.py tests/test_wifi_sm_ref.py tests/firmware/test_wifi_sm_parity.py tests/test_semantics_js_parity.py tests/test_app_bundle.py tests/test_control_vectors.py -q

  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - name: Install deps
        run: pip install -r requirements-e2e.txt
      - name: Playwright version (for the browser cache key)
        run: echo "PW_VERSION=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PW_VERSION }}
      - name: Install Chromium (browser from cache when present; apt --with-deps only on miss)
        run: python -m playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}
      - name: GUI end-to-end (web UI over the mock unit)
        run: python -m pytest tests/e2e -q

  pairing-real-stack:
    # calictl's real BluezTransport pairs with the fake unit over real BlueZ inside a VM (GitHub's
    # runner kernel has no Bluetooth). Not a required check until it has been reliably green.
    # No setup-python on purpose: the VM boots off the runner's root filesystem and runs the SYSTEM
    # python3, so vm.sh installs the rig's deps (bumble, bleak, dbus-fast) for that interpreter.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pair over real BlueZ in a VM
        run: bash tests/realstack/vm.sh

  firmware-host-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # observed ~4.6 min on the probe runs; a hang must not burn 6 h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-e2e.txt
      - name: Install deps (32-bit toolchain, Bumble, Playwright)
        # 32-bit toolchain: NimBLE's Linux port builds with -m32 (Mbed TLS is built from source, 32-bit).
        # requirements-e2e.txt: Playwright for test_web_e2e.py::test_page_renders + test_setup_flow_in_browser (the page).
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
          pip install -r requirements-dev.txt -r requirements-e2e.txt
      # The browser install mirrors gui-e2e (same cache key, so the two jobs share the cache entry).
      - name: Playwright version (for the browser cache key)
        run: echo "PW_VERSION=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PW_VERSION }}
      - name: Install Chromium (browser from cache when present; apt --with-deps only on miss)
        run: python -m playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}
      - name: Firmware tests incl. host tier (BLE e2e + bond store over NimBLE/Bumble, WiFi/web e2e + status page in Chromium)
        env:
          CALI_REQUIRE_CHROMIUM: "1"   # the status-page test fails, not skips, without a browser
        run: python -m pytest tests/firmware -v -rs

  # The esp32s3 (M5Stack CoreS3) image: compile-only (no hardware in CI). Proves cali_core,
  # cali_ble_nimble (unchanged) and the NVS platform build against ESP-IDF's esp-nimble, with
  # codec_encode compiled out (the build fails if it reaches the ELF). Pin: firmware/README.md.
  firmware-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # observed 3.0-4.2 min on the probe runs; a hang must not burn 6 h
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build esp32s3 image
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build
          { echo '```'; idf.py size; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-esp32s3
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json

  # The "chip simulator" tier (#154 Task 9): the esp32s3 image boots in Espressif's QEMU (pinned by
  # the IDF: tools/tools.json, esp-develop-9.2.2-20260417, in the same container). Its own variant
  # (qemu/sdkconfig.qemu: UART0 console, CONFIG_CALI_QEMU_PROBE = kvprobe command + no BT controller
  # init), built here and never uploaded, so the probe never ships; firmware-build's release image
  # fails its build if "kvprobe" reaches the ELF. Proves boot, the console line protocol on the
  # no-controller path, and NVS (the bond store) surviving a reboot. No Bluetooth in QEMU.
  firmware-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # observed 2.7-3.1 min on the probe runs; a hang must not burn 6 h
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the QEMU probe variant
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build-qemu -D SDKCONFIG=build-qemu/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;qemu/sdkconfig.qemu" build
      - name: Boot in QEMU + NVS persistence
        run: |
          . $IDF_PATH/export.sh
          pip install pytest
          CALI_QEMU=1 python -m pytest tests/firmware/test_qemu_boot.py -v
