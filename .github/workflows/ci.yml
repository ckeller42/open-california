name: CI

on:
  push:
    branches: [main, vwcamper-control]
  pull_request:

# Cancel superseded runs on the same ref (rapid pushes stop paying for old commits). Read-only
# jobs, so cancelling mid-run is safe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no CI job writes to the repo (the screenshots workflow keeps its own write scope).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor 3.11 (3.9/3.10 are EOL); 3.13 is what buspi (the deploy target) runs.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test/tooling deps (runtime is stdlib-only)
        run: pip install -r requirements-dev.txt
      - name: Test suite (parallel; conftest isolates state per-test so it's xdist-safe)
        run: python -m pytest tests/ -q -n auto
      # The next three checks are Python-version-independent -> run once (on the deploy target 3.13)
      # instead of 3x. The import-cleanliness guard stays on ALL versions (a stdlib layout can differ).
      - name: Signal-coverage + semantic-review audit
        if: matrix.python == '3.13'
        run: python -m tools.audit_signals --report
      - name: Web assets are fresh (screens.json == build_web output)
        if: matrix.python == '3.13'
        run: |
          python -m tools.build_web --out /tmp/screens.json
          diff -q /tmp/screens.json calictl/webui/screens.json \
            || { echo "::error::screens.json stale — run python -m tools.build_web"; exit 1; }
      - name: Runtime is stdlib-only at import
        run: python -m tools.check_import_clean   # shared with tools/ci.sh + the pre-commit hook

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff lint (config in pyproject.toml)
        run: python -m ruff check .

  no-vendor-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed VW/vendor material or vehicle PII
        run: |
          set -e
          bad=$(git ls-files | grep -iE '\.(apk|xapk|dex|jar|aar|aab|cvr|pcap|pcapng|pklg|btsnoop)$|(^|/)decompile/|(^|/)manuals/|ui/assets/svg/' || true)
          if [ -n "$bad" ]; then echo "::error::vendor/binary material committed:"; echo "$bad"; exit 1; fi
          # real vehicle BLE MAC must not be committed (use a placeholder). Match by the
          # unit's OUI prefix + any suffix so this guard doesn't embed the full device MAC.
          if git grep -niE '20:81:9a(:[0-9a-f]{2}){3}' -- . ':!.github/' ':!.githooks/'; then
            echo "::error::real vehicle BLE MAC committed — use a placeholder / env var"; exit 1; fi
          # No committed VIN (PII). Mirrors the pre-commit hook: a 17-char VIN token AND a
          # WV2ZZZ/VIN context on the same line (WV2ZZZ is the generic VW world-manufacturer
          # prefix, safe to name; the owner's full VIN never appears in the repo).
          if git grep -nE '\b[A-HJ-NPR-Z0-9]{17}\b' -- . ':!.github/' ':!.githooks/' | grep -qiE 'WV2ZZZ|VIN'; then
            echo "::error::a VIN appears in a tracked file — VINs are PII, keep them out"; exit 1; fi
          echo "no vendor material, vehicle MAC, or VIN committed"

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint install.sh (POSIX syntax + shellcheck)
        run: |
          sh -n install.sh
          shellcheck install.sh

  # Python <-> C codec parity (issue #156): the generated header must be fresh and
  # every golden vector + the seeded fuzz pass must agree between calictl.protocol
  # and the host-compiled csrc/ codec. gcc is preinstalled on ubuntu-latest.
  codec-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Generated C header is fresh
        run: python -m tools.gen_c_dict --check
      - name: Vectors + differential parity (compiles csrc/)
        run: python -m pytest tests/test_codec_vectors.py tests/test_gen_c_dict.py tests/test_codec_parity.py tests/test_ports_parity.py -q

  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - name: Install deps
        run: pip install -r requirements-e2e.txt
      - name: Playwright version (for the browser cache key)
        run: echo "PW_VERSION=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PW_VERSION }}
      - name: Install Chromium (browser from cache when present; apt --with-deps only on miss)
        run: python -m playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}
      - name: GUI end-to-end (web UI over the mock unit)
        run: python -m pytest tests/e2e -q
