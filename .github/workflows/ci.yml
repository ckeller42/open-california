name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR ref (rapid pushes stop paying for old commits). Read-only
# jobs, so cancelling mid-run is safe. Pushes to main are never cancelled: every main commit
# keeps its own complete CI result.
concurrency:
  # PRs share one group per ref (superseded runs are cancelled). Every push gets its own group:
  # a shared group would still cancel an older *pending* run, leaving a main commit without CI.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: read-only by default; only the main-only coverage-badge and firmware-release jobs
# (below) write (the screenshots workflow keeps its own write scope).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Floor 3.11 (3.9/3.10 are EOL); 3.13 is what buspi (the deploy target) runs.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test/tooling deps (runtime is stdlib-only)
        run: pip install -r requirements-dev.txt
      - name: Test suite (parallel; conftest isolates state per-test so it's xdist-safe)
        # Tests marked linux_only (tests/firmware: the NimBLE host e2e + bond store + the i686 control twin) need a 32-bit
        # toolchain + a NimBLE build: their own job (firmware-host-e2e). The rest of tests/firmware
        # (the pure-C SM parity, runner and session fakes) has no BLE dependency and runs here too.
        if: matrix.python != '3.13'
        run: python -m pytest tests/ -q -n auto --dist loadfile -m "not linux_only"
      # 3.13 runs the same suite under coverage instead (tools/ci.sh cov): the floor gates calictl/
      # only ([tool.coverage.report] fail_under in pyproject.toml, a ratchet); tools/ is informational.
      - name: Test suite + coverage floor (calictl/)
        if: matrix.python == '3.13'
        run: PY=python tools/ci.sh cov
      - name: Coverage summary + badge data
        if: matrix.python == '3.13' && !cancelled() && hashFiles('coverage.xml') != ''
        run: |
          total=$(python -m coverage report --include='calictl/*' --format=total --fail-under=0)
          floor=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['coverage']['report']['fail_under'])")
          echo "**Coverage (calictl/, line+branch): ${total}%** — floor ${floor}%" >> "$GITHUB_STEP_SUMMARY"
          color=$(python -c "t=$total; print('brightgreen' if t>=90 else 'green' if t>=80 else 'yellow' if t>=70 else 'orange')")
          mkdir -p coverage-out && cp -r coverage.xml htmlcov coverage-out/
          printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' "$total" "$color" > coverage-out/coverage.json
      - name: Upload coverage report (XML + HTML + badge JSON)
        if: matrix.python == '3.13' && !cancelled() && hashFiles('coverage-out/coverage.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage-out/
      # The next three checks are Python-version-independent -> run once (on the deploy target 3.13)
      # instead of 3x. The import-cleanliness guard stays on ALL versions (a stdlib layout can differ).
      - name: Signal-coverage + semantic-review audit
        if: matrix.python == '3.13'
        run: python -m tools.audit_signals --report
      - name: Web assets are fresh (screens.json == build_web output)
        if: matrix.python == '3.13'
        run: |
          python -m tools.build_web --out /tmp/screens.json
          diff -q /tmp/screens.json calictl/webui/screens.json \
            || { echo "::error::screens.json stale — run python -m tools.build_web"; exit 1; }
      - name: Runtime is stdlib-only at import
        run: python -m tools.check_import_clean   # shared with tools/ci.sh + the import-clean pre-commit hook

  # main only: commit the shields.io endpoint JSON the README coverage badge reads (self-generated,
  # no third-party upload or token). [skip ci] prevents a re-trigger loop, like screenshots.yml.
  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials stays at its default (true) ON PURPOSE: the last step runs
        # `git push` with the checkout token.
        with:
          persist-credentials: true  # zizmor: ignore[artipacked] -- the final step pushes with this token
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: /tmp/coverage
      # main is ruleset-protected (PRs only): the badge JSON lives on its own `badges` branch
      # (the README's shields endpoint reads it from there).
      - name: Commit the badge JSON to the badges branch (if it changed)
        run: |
          w="$RUNNER_TEMP/badges"
          if git fetch -q origin badges; then
            git worktree add -q "$w" FETCH_HEAD
          else
            git worktree add -q --detach "$w" && git -C "$w" checkout -q --orphan badges && git -C "$w" rm -rqf .
          fi
          mkdir -p "$w/.github/badges" && cp /tmp/coverage/coverage.json "$w/.github/badges/coverage.json"
          cd "$w"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          if git diff --cached --quiet; then
            echo "coverage badge unchanged"
          else
            git commit -qm "ci: update coverage badge"
            git push -q origin HEAD:badges
          fi

  # Every pre-commit-stage hook in .pre-commit-config.yaml over the whole tree (ruff + ruff format,
  # markdownlint, gitleaks, whitespace/YAML, the vendor/MAC/VIN guard, import-clean, doc-offset,
  # screens.json + codec freshness, and the web-UI tsc --checkJs gate — the web UI is un-built JS,
  # so that is its only static check; a ReferenceError once shipped to the Pi without it). The
  # repo-local hooks run via tools/ci.sh (need the dev deps + node); tool versions are pinned in the
  # config, so this job, the local hooks and `tools/ci.sh lint` cannot drift apart.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit (all files)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: mypy type check (calictl/)
        run: python -m mypy calictl/
      - name: Bridge tests (the Cloudflare Worker that authenticates the TTN webhook; = tools/ci.sh bridge)
        run: node --test "bridge/test/*.test.mjs"
      - name: gitleaks over the working tree (the commit hook only scans staged changes)
        run: pre-commit run --hook-stage manual gitleaks-dir --all-files

  no-vendor-material:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse committed VW/vendor material or vehicle PII
        # Whole tracked tree: vendor paths, the real vehicle BLE MAC (matched by OUI prefix), VINs.
        # Same script as the `vendor-material` pre-commit hook and `tools/ci.sh vendor-check`.
        run: python3 tools/check_vendor_material.py --all

  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint install.sh (POSIX syntax + shellcheck)
        run: |
          sh -n install.sh
          shellcheck install.sh

  # The Sphinx site (product docs + the evidence build, `-W`) on every PR, so a broken `:links:`,
  # cross-reference or toctree fails before merge. docs.yml runs the same build on main and deploys.
  docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install doc toolchain
        run: pip install -r docs/requirements.txt
      - name: Install doxygen (firmware C API docs)
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Build the site (warnings are errors)
        run: sh docs/build_site.sh docs/_build/html

  # Python <-> C codec parity (issue #156): the generated header must be fresh and
  # every golden vector + the seeded fuzz pass must agree between calictl.protocol
  # and the host-compiled csrc/ codec. gcc is preinstalled on ubuntu-latest.
  codec-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Generated artifacts are fresh (csrc/ codec_dict.h + codec_chars.h + pairing_consts.h + net_consts.h + control_consts.h, firmware/web/ strings_gen.h + index_gen.html + app_bundle_gen.h, calictl/webui/semantics_tables.js)
        run: python -m tools.gen_c_dict --check
      - name: Golden vectors are fresh
        run: python -m tools.gen_codec_vectors --check
      - name: WiFi SM golden vectors are fresh (tools/wifi_sm_ref.py -> tests/vectors/wifi_sm.json)
        run: python -m tools.gen_wifi_vectors --check
      - name: Semantics golden vectors are fresh (calictl/semantics.py -> tests/vectors/semantics.json)
        run: python -m tools.gen_semantics_vectors --check
      - name: ESP control vectors are fresh (calictl/control.py -> tests/vectors/control.json)
        run: python -m tools.gen_control_vectors --check
      - name: Vectors + differential parity (compiles csrc/)
        run: python -m pytest tests/test_codec_vectors.py tests/test_gen_c_dict.py tests/test_codec_parity.py tests/test_ports_parity.py tests/test_wifi_sm_ref.py tests/firmware/test_wifi_sm_parity.py tests/test_semantics_js_parity.py tests/test_app_bundle.py tests/test_control_vectors.py tests/firmware/test_control_parity.py -q

  gui-e2e:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.gui != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - name: Install deps
        run: pip install -r requirements-e2e.txt pytest-xdist
      - name: Playwright version (for the browser cache key)
        run: echo "PW_VERSION=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PW_VERSION }}
      - name: Install Chromium (browser from cache when present; apt --with-deps only on miss)
        run: python -m playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}
      - name: GUI end-to-end (web UI over the mock unit)
        # 4 xdist workers (ubuntu-latest has 4 vCPUs), each test file whole on one worker, in order:
        # test_gui.py's tests share one module-scoped daemon and build on each other's state. Not
        # loadgroup: with pytest 9 and pytest-xdist 3.8 the xdist_group mark has no effect (xdist
        # renames item._nodeid, pytest 9 reads item._id), so test_gui.py got spread over the workers.
        run: python -m pytest tests/e2e -q -n 4 --dist loadfile

  pairing-real-stack:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.realstack != 'false') }}
    # calictl's real BluezTransport pairs with the fake unit over real BlueZ inside a VM (GitHub's
    # runner kernel has no Bluetooth). Not a required check until it has been reliably green.
    # No setup-python on purpose: the VM boots off the runner's root filesystem and runs the SYSTEM
    # python3, so vm.sh installs the rig's deps (bumble, bleak, dbus-fast) for that interpreter.
    # continue-on-error: the runner image lacks linux-modules-extra-<kernel> (no Bluetooth module
    # for the VM), so this job fails on every run; a red job here must not make main's run red
    # (flash_ci.sh main, promote_stable.sh and esp-stable.yml look for a successful CI run).
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30   # ~14 min (2026-10-22 morning); >20 on slow runners the same evening
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The guest's .deb files come from the cache (GitHub's storage: 38–106 MB/s in every region,
      # 2026-11-06) instead of the mirror (azure.archive.ubuntu.com: 7–36 kB/s on westus2 runners).
      # The newest entry is restored; vm.sh downloads only what changed and names the new set.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/debs
          key: realstack-debs-v1-restore
          restore-keys: realstack-debs-v1-
      - name: Pair over real BlueZ in a VM
        id: rig
        run: bash tests/realstack/vm.sh
      - if: always() && steps.rig.outputs.debs_key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/debs
          key: realstack-debs-v1-${{ steps.rig.outputs.debs_key }}

  # tests/firmware in 3 groups of about equal run time (pytest-split over the committed
  # tests/firmware/.test_durations), each on its own runner with 4 xdist workers. The required check
  # is `firmware-host-e2e` (below), which only collects the three results.
  firmware-host-e2e-split:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.host_e2e != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 40   # ~37 min serial (2026-11-26, #567), a third of it on 4 workers + install/Chromium (0.5–18 min on a slow mirror); a hang must not burn 6 h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-e2e.txt
      - name: Install deps (32-bit toolchain, Bumble, Playwright)
        # 32-bit toolchain: NimBLE's Linux port builds with -m32 (Mbed TLS is built from source, 32-bit).
        # requirements-e2e.txt: Playwright for test_web_e2e.py::test_page_renders + test_setup_flow_in_browser (the page).
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
          pip install -r requirements-dev.txt -r requirements-e2e.txt
      # The browser install mirrors gui-e2e (same cache key, so the two jobs share the cache entry).
      - name: Playwright version (for the browser cache key)
        run: echo "PW_VERSION=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PW_VERSION }}
      - name: Install Chromium (browser from cache when present; apt --with-deps only on miss)
        run: python -m playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}
      # The pinned NimBLE + Mbed TLS checkouts and the 32-bit Mbed TLS libraries the Makefile builds
      # in them (fetch_nimble.sh keeps a checkout whose tag matches the pin; make rebuilds what is stale).
      - name: Cache firmware/host/_deps (NimBLE, Mbed TLS)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: firmware/host/_deps
          key: host-deps-v1-${{ hashFiles('firmware/host/fetch_nimble.sh', 'firmware/host/Makefile') }}
      - name: Firmware tests incl. host tier (BLE e2e + bond store over NimBLE/Bumble, WiFi/web e2e + status page in Chromium)
        env:
          CALI_REQUIRE_CHROMIUM: "1"   # the status-page test fails, not skips, without a browser
        # 4 xdist workers (ubuntu-latest has 4 vCPUs), each test file of the group whole on one worker;
        # build_host() (conftest.py) locks the shared firmware/host build. A test missing from
        # .test_durations gets the average time; refresh the file with --store-durations after big changes.
        run: >-
          python -m pytest tests/firmware -v -rs -n 4 --dist loadfile
          --splits 3 --group ${{ matrix.group }} --splitting-algorithm least_duration
          --durations-path tests/firmware/.test_durations

  # The required check: green when every group of firmware-host-e2e-split passed (or the filter
  # skipped them), red when one failed or was cancelled.
  firmware-host-e2e:
    needs: firmware-host-e2e-split
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.firmware-host-e2e-split.result }}
        run: |
          echo "firmware-host-e2e-split: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]

  # The simulated-hardware tier (docs/firmware.md, "Sim"): the real ESP-only LoRa driver (lora_esp.c, unchanged)
  # on coresim's virtual-clock FreeRTOS (sim/shims) and display.c's AXP2101 read against its fake RAK3172, AW9523 and
  # AXP2101 (sim/coresim; the satellite
  # adapter is tests/firmware/esp_sim.py). coresim's own unit tests (sim/tests) run here too.
  # firmware-host-e2e collects these tests too; this job is the fast signal and fails on a skip (no 32-bit
  # toolchain or no bumble would skip every test), so it never passes empty.
  firmware-sim:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.firmware != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps (32-bit toolchain, pytest + bumble)
        # g++-multilib too: the linux_only skip check (tests/firmware/conftest.py) links a C++ probe
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
          pip install -r requirements-dev.txt -e ./sim
      - name: coresim's own tests, then lora_esp.c against the fake RAK3172, AW9523 and AXP2101
        shell: bash
        run: |
          python -m pytest sim/tests tests/firmware/test_lora_esp_sim.py tests/firmware/test_lora_scenarios.py -v -rs 2>&1 | tee sim.log
          ! grep -q SKIPPED sim.log

  # The esp32s3 (M5Stack CoreS3) image: compile-only (no hardware in CI). Proves cali_core,
  # cali_ble_nimble (unchanged) and the NVS platform build against ESP-IDF's esp-nimble.
  # Pin: firmware/README.md.
  firmware-build:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.firmware != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15   # observed 3.0-4.2 min on the probe runs; a hang must not burn 6 h
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ccache (the IDF image sets IDF_CCACHE_ENABLE=1). A PR build starts from the newest cache; a
      # push to main (the image firmware-release ships) always compiles from scratch and only saves
      # its cache for the PRs. compiler_check content: the default (mtime) also hashes the mtime of the
      # toolchain's specs file, which differs in every container, so nothing would hit.
      - if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-fw-${{ github.sha }}
          restore-keys: ccache-fw-
      - name: Build esp32s3 image
        working-directory: firmware
        env:
          CCACHE_DIR: /github/home/.ccache
          CCACHE_COMPILERCHECK: content
        run: |
          . "$IDF_PATH/export.sh"
          ccache -z
          idf.py build
          ccache -s
          { echo '```'; idf.py size; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          # Flash safety (docs/firmware.md "CI jobs"): resolved config vs sdkconfig.defaults, the built
          # partition table, flasher_args.json offsets (never NVS), app <= 90 % of its OTA slot, version.
          python ../tools/check_fw_build.py build --sha "$GITHUB_SHA"
          # First-flash image for new boards (docs/howto-esp-first-flash.md): every image at the
          # build's own offsets, gaps 0xFF — so it ERASES NVS (bonds, WiFi). Never used by OTA.
          (cd build && python -m esptool --chip esp32s3 merge-bin -o cali_fw_full.bin @flash_args)
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-fw-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-esp32s3
          # *.bin = cali_fw.bin + ota_data_initial.bin (otadata, R_FW_OTA: flash_ci.sh writes it)
          # + cali_fw_full.bin (the merged first-flash image; flash_ci.sh ignores it)
          # + cali_fw.elf (symbols: an evt panic backtrace, R_FW_PANIC_CAPTURE)
          path: |
            firmware/build/*.bin
            firmware/build/cali_fw.elf
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json

  # The OTA source (R_FW_OTA): every main merge's app image + manifest.json on the prerelease
  # `esp-latest`, which the ESP fetches on request (POST /api/ota). Only on push to main (a PR build
  # never ships), so the release is always a real merge commit ([skip ci] commits never run CI).
  # cali_fw.bin goes up before the manifest that names it; a manifest racing a newer bin fails the
  # ESP's SHA-256 check, never boots. One release job at a time.
  firmware-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [firmware-build, firmware-qemu]   # no esp-latest image that failed its QEMU boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: firmware-release
      cancel-in-progress: false
    permissions:
      contents: write   # gh release create/upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-esp32s3
          path: fw
      - name: Upload cali_fw.bin + manifest.json (+ the first-flash cali_fw_full.bin) to the esp-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # The group runs one release at a time but not in commit order: an older merge's job that
          # finishes last would put the older build back. Skip when the release already holds a
          # commit that is ahead of this one.
          cur=$(gh release download esp-latest -p manifest.json -O - 2>/dev/null | jq -r '.sha // empty' || true)
          if [ -n "$cur" ] && [ "$cur" != "$SHA" ] &&
             [ "$(gh api "repos/$GH_REPO/compare/$SHA...$cur" --jq .status)" = ahead ]; then
            echo "esp-latest already holds $cur, which is newer than $SHA: not overwritten" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bin=fw/cali_fw.bin
          jq -n --arg sha "$SHA" --argjson size "$(stat -c %s "$bin")" \
            --arg sha256 "$(sha256sum "$bin" | cut -d' ' -f1)" --argjson run_id "$RUN_ID" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sha: $sha, size: $size, sha256: $sha256, run_id: $run_id, built_at: $built_at}' > manifest.json
          tee -a "$GITHUB_STEP_SUMMARY" < manifest.json
          gh release view esp-latest >/dev/null 2>&1 || gh release create esp-latest --prerelease \
            --target "$SHA" --title "ESP firmware (latest main)" \
            --notes "The ESP32 satellite's OTA source: the app image of the latest main merge (R_FW_OTA, docs/firmware.md). Rewritten by CI on every merge."
          gh release upload esp-latest "$bin" --clobber
          gh release upload esp-latest manifest.json --clobber
          gh release upload esp-latest fw/cali_fw_full.bin --clobber   # USB first flash only; not in the manifest
          gh release upload esp-latest fw/cali_fw.elf --clobber   # symbols for an evt panic backtrace (R_FW_PANIC_CAPTURE)

  # The "chip simulator" tier (#154 Task 9): the esp32s3 image boots in Espressif's QEMU (pinned by
  # the IDF: tools/tools.json, esp-develop-9.2.2-20260417, in the same container). Its own variant
  # (qemu/sdkconfig.qemu: UART0 console, CONFIG_CALI_QEMU_PROBE = kvprobe command + no BT controller
  # init), built here and never uploaded, so the probe never ships; firmware-build's release image
  # fails its build if "kvprobe" reaches the ELF. Proves boot, the console line protocol on the
  # no-controller path, and NVS (the bond store) surviving a reboot. No Bluetooth in QEMU.
  firmware-qemu:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.firmware != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15   # observed 2.7-3.1 min on the probe runs; a hang must not burn 6 h
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ccache, as in firmware-build (this image never ships, so main restores the cache too).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-qemu-${{ github.sha }}
          restore-keys: ccache-qemu-
      - name: Build the QEMU probe variant
        working-directory: firmware
        env:
          CCACHE_DIR: /github/home/.ccache
          CCACHE_COMPILERCHECK: content
        run: |
          . "$IDF_PATH/export.sh"
          ccache -z
          idf.py -B build-qemu -D SDKCONFIG=build-qemu/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;qemu/sdkconfig.qemu" build
          ccache -s
      - name: Boot in QEMU + NVS persistence
        run: |
          . "$IDF_PATH/export.sh"
          pip install pytest
          CALI_QEMU=1 python -m pytest tests/firmware/test_qemu_boot.py tests/firmware/test_qemu_ota.py -v

  # Which heavy jobs a PR needs: tools/ci_changes.py holds one path filter per area (what each job
  # builds, imports or serves; ci.yml itself runs everything) and prints one output per area. A push
  # to main runs every job but `ios` regardless (each job's `if:`). A job whose output is missing
  # (this job failed) runs: `!= 'false'`, so an error here never skips a required check. `ios` keeps
  # the filter on main pushes too, so a merge without iOS changes never pays for a macOS runner.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      host_e2e: ${{ steps.filter.outputs.host_e2e }}
      gui: ${{ steps.filter.outputs.gui }}
      realstack: ${{ steps.filter.outputs.realstack }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # a PR checks out its merge commit and main gets squash merges: HEAD^1 is the base
      - id: filter
        run: |
          # --no-renames: a renamed file lists its old path too. A failed diff stops here, so the
          # outputs stay missing and every filtered job runs.
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          python3 -m tools.ci_changes < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # The iPhone app (docs/ios-app.md): the Swift package tests (plain, ASan, UBSan), the app's unit,
  # snapshot and UI tests on the simulator, then SwiftLint + swift-format. The xcode-27 image has
  # Xcode 27.2 but no iOS 27.2 simulator; the snapshot references are recorded on the iPhone 17
  # simulator with iOS 27.0, its only iPhone 17 runtime. The references use perceptualPrecision 0.98
  # for the rendering of a different host. Not a required check.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Generated artifacts are fresh (incl. the semantics tables the Swift package bundles)
        run: |
          pip install pyyaml
          python -m tools.gen_c_dict --check
      - name: Install XcodeGen 2.46.0 + SwiftLint 0.63.2 (release binaries, SHA-256 checked)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          curl -fsSLo swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.63.2/portable_swiftlint.zip
          shasum -a 256 -c <<'SUMS'
          4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip
          c59a405c85f95b92ced677a500804e081596a4cae4a6a485af76065557d6ed29  swiftlint.zip
          SUMS
          unzip -q xcodegen.zip && unzip -q swiftlint.zip -d swiftlint
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          xcodebuild -version
          xcodegen --version
          swiftlint version
          swift format --version
          xcbeautify --version
      - name: Swift package tests
        run: swift test
      - name: Swift package tests under ASan + UBSan
        timeout-minutes: 25   # each leg has its own 10 min watchdog that samples a hang
        env:
          SANITIZE_SAMPLES: ${{ runner.temp }}
        run: tools/ios_sanitize.sh
      - name: Generate the Xcode project
        if: ${{ !cancelled() }}   # also after a sanitizer failure: the app tests are separate evidence
        run: xcodegen generate --spec ios/project.yml
      # Two steps, each with its own limit: slow UI tests must not cut off the unit and snapshot
      # tests. The first step builds; the second reuses that build.
      - name: App unit and snapshot tests on the simulator
        if: ${{ !cancelled() }}   # also after a sanitizer failure: the app tests are separate evidence
        timeout-minutes: 25
        env:
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-diffs
        run: |
          set -o pipefail
          xcodebuild test -project ios/Camper.xcodeproj -scheme Camper \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' -only-testing:AppTests \
            -resultBundlePath "$RUNNER_TEMP/AppTests.xcresult" | xcbeautify
      - name: App UI tests on the simulator
        if: ${{ !cancelled() }}   # also after a failed unit or snapshot test
        timeout-minutes: 35   # xcodebuild can hang after the UI tests
        run: |
          set -o pipefail
          xcodebuild test -project ios/Camper.xcodeproj -scheme Camper \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' -only-testing:AppUITests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 \
            -resultBundlePath "$RUNNER_TEMP/AppUITests.xcresult" | xcbeautify
      # The linters after the tests (also when a test failed): a lint finding must not hide the test
      # result.
      - name: SwiftLint
        if: always()
        working-directory: ios
        run: swiftlint --strict
      - name: swift-format
        if: always()
        run: swift format lint --strict --recursive ios/
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/snapshot-diffs
            ${{ runner.temp }}/AppTests.xcresult
            ${{ runner.temp }}/AppUITests.xcresult
            ${{ runner.temp }}/sanitize-sample-*.txt
          if-no-files-found: ignore

  # The one check a PR needs (the ruleset can require this job alone): fails when a job it needs
  # failed or was cancelled; a job its `if:` skipped (the path filters above, the main-only jobs)
  # counts as passed. `pairing-real-stack` (continue-on-error) and `ios` are not required, so it
  # does not wait for them.
  ci-ok:
    if: always()
    needs: [changes, test, pre-commit, no-vendor-material, install-script, docs, codec-parity, gui-e2e,
            firmware-host-e2e-split, firmware-host-e2e, firmware-build, firmware-qemu, firmware-sim, coverage-badge,
            firmware-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed jobs: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1;; esac
