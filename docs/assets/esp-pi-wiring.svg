<g font-size="11">
<text x="140" y="155" class="ink" text-anchor="middle">SoC</text>
<text x="380" y="100" text-anchor="middle" style="fill:#1d2420">USB 2</text><text x="380" y="190" text-anchor="middle" style="fill:#1d2420">USB 3</text><text x="380" y="280" text-anchor="middle" style="fill:#1d2420">Ethernet</text>
<text x="32" y="348" class="m">USB-C</text><text x="130" y="348" class="m">2× micro-HDMI</text>
<text x="40" y="112" class="ink">pin 1 (square)</text>
<text x="150" y="124" style="fill:#fff" class="b">pins 5, 6, 11</text>
</g>
<path d="M60 100 L 71 81 M170 112 L 98 81 M180 112 L 133 81" stroke="#fff" stroke-width="1.5" fill="none"/>
<text x="32" y="380" font-size="12" class="m">Header along the top edge; pin 1 at the end away from</text>
<text x="32" y="396" font-size="12" class="m">the USB ports. Odd pins inner row, even pins at the edge.</text>
<text x="32" y="420" font-size="12" class="m">Pins 5 + 6: 3rd pair from the left. Pin 11: 6th, inner row.</text>
<text x="32" y="444" font-size="12" class="m">Outline to scale (85 × 56 mm); parts approximate.</text>
</g>
<g transform="translate(488,516)">
<rect x="0" y="0" width="460" height="490" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="20" y="30" font-size="14" class="b">40-pin header (pins 1–20)</text>
<rect x="146" y="44" width="56" height="276" rx="6" fill="var(--pcb)"/>
<circle cx="161" cy="58" r="9" fill="var(--v33)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="161" y="61.5" text-anchor="middle" font-size="9" style="fill:#fff">1</text>
<text x="140" y="62" text-anchor="end" font-size="11">3V3</text>
<circle cx="187" cy="58" r="9" fill="var(--v5)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="187" y="61.5" text-anchor="middle" font-size="9" style="fill:#fff">2</text>
<text x="208" y="62" font-size="11">5V</text>
<circle cx="161" cy="85" r="9" fill="var(--gpio)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="161" y="88.5" text-anchor="middle" font-size="9" style="fill:#fff">3</text>
<text x="140" y="89" text-anchor="end" font-size="11">GPIO2</text>
<circle cx="187" cy="85" r="9" fill="var(--v5)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="187" y="88.5" text-anchor="middle" font-size="9" style="fill:#fff">4</text>
<text x="208" y="89" font-size="11">5V</text>
<circle cx="161" cy="112" r="9" fill="var(--gpio)" stroke="var(--hl)" stroke-width="3"/>
<text x="161" y="115.5" text-anchor="middle" font-size="9" style="fill:#fff">5</text>
<text x="140" y="116" text-anchor="end" font-size="11" class="b">GPIO3</text>
<text x="20" y="116" font-size="10" style="fill:var(--hl)">wake</text>
<circle cx="187" cy="112" r="9" fill="var(--gnd)" stroke="var(--hl)" stroke-width="3"/>
<text x="187" y="115.5" text-anchor="middle" font-size="9" style="fill:#fff">6</text>
<text x="208" y="116" font-size="11" class="b">GND  ← ESP GND (black)</text>
<circle cx="161" cy="139" r="9" fill="var(--gpio)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="161" y="142.5" text-anchor="middle" font-size="9" style="fill:#fff">7</text>
