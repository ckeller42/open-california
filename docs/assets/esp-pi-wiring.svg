<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1020" width="960" font-family="ui-monospace,Menlo,Consolas,monospace" role="img" aria-label="Wiring from M5Stack CoreS3 Port B to Raspberry Pi 4 pins 5, 6 and 11">
<style>
svg{--bg:#f3f5f2;--panel:#fff;--fg:#1d2420;--muted:#5d6b63;--line:#c9d2cc;--pcb:#1f6b45;--ink:#e8f3ec;--pin:#c9a227;
--gnd:#222;--gndw:#222;--v5:#d0342c;--v33:#e07a1f;--gpio:#3f7d58;--sig:#e3b505;--sig2:#9aa3a0;--hl:#0b6bcb}
@media (prefers-color-scheme:dark){svg{--bg:#121614;--panel:#1b201d;--fg:#e4ebe6;--muted:#9aa8a0;--line:#2f3833;
--pcb:#1c5a3b;--gnd:#8a8f8c;--gndw:#8a8f8c;--hl:#5aa9ff;--sig2:#c8cfcc}}
text{fill:var(--fg)} .m{fill:var(--muted)} .ink{fill:var(--ink)} .b{font-weight:600}
</style>
<rect width="960" height="1020" rx="12" fill="var(--bg)"/>
<text x="24" y="40" font-size="22" class="b">ESP satellite → buspi: wake + shutdown wiring</text>
<text x="24" y="64" font-size="13" class="m">M5Stack CoreS3 Port B → Raspberry Pi 4 header. Grove to 4-pin female Dupont cable, 20–50 cm.</text>
<g transform="translate(0,80)">
<rect x="12" y="0" width="936" height="420" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<rect x="40" y="60" width="250" height="250" rx="22" fill="var(--panel)" stroke="var(--fg)" stroke-width="2"/>
<rect x="65" y="85" width="200" height="140" rx="6" fill="var(--line)"/>
<text x="165" y="160" text-anchor="middle" font-size="16">M5Stack CoreS3</text>
<text x="165" y="182" text-anchor="middle" font-size="12" class="m">ESP32-S3 satellite</text>
<rect x="60" y="296" width="56" height="26" rx="3" fill="var(--v5)"/>
<text x="88" y="272" text-anchor="middle" font-size="12">Port A</text>
<text x="88" y="288" text-anchor="middle" font-size="12" class="m">G2 · G1</text>
<rect x="137" y="296" width="56" height="26" rx="3" fill="var(--gnd)" stroke="var(--hl)" stroke-width="3"/>
<text x="165" y="272" text-anchor="middle" font-size="12" class="b">Port B</text>
<text x="165" y="288" text-anchor="middle" font-size="12" class="m">G9 · G8</text>
<rect x="214" y="296" width="56" height="26" rx="3" fill="#2f6fd0"/>
<text x="242" y="272" text-anchor="middle" font-size="12">Port C</text>
<text x="242" y="288" text-anchor="middle" font-size="12" class="m">G17 · G18</text>
<rect x="520" y="30" width="390" height="110" rx="8" fill="var(--pcb)"/>
<text x="910" y="160" text-anchor="end" font-size="12" class="m">Raspberry Pi 4 · GPIO header, pins 1–12</text>
<circle cx="552" cy="108" r="13" fill="var(--v33)" stroke="var(--pin)" stroke-width="2"/>
<text x="552" y="112" text-anchor="middle" font-size="11" style="fill:#fff">1</text>
<circle cx="552" cy="62" r="13" fill="var(--v5)" stroke="var(--pin)" stroke-width="2"/>
<text x="552" y="66" text-anchor="middle" font-size="11" style="fill:#fff">2</text>
<circle cx="596" cy="108" r="13" fill="var(--gpio)" stroke="var(--pin)" stroke-width="2"/>
<text x="596" y="112" text-anchor="middle" font-size="11" style="fill:#fff">3</text>
<circle cx="596" cy="62" r="13" fill="var(--v5)" stroke="var(--pin)" stroke-width="2"/>
<text x="596" y="66" text-anchor="middle" font-size="11" style="fill:#fff">4</text>
<circle cx="640" cy="108" r="13" fill="var(--gpio)" stroke="var(--hl)" stroke-width="4"/>
<text x="640" y="112" text-anchor="middle" font-size="11" style="fill:#fff">5</text>
<circle cx="640" cy="62" r="13" fill="var(--gnd)" stroke="var(--hl)" stroke-width="4"/>
<text x="640" y="66" text-anchor="middle" font-size="11" style="fill:#fff">6</text>
<circle cx="684" cy="108" r="13" fill="var(--gpio)" stroke="var(--pin)" stroke-width="2"/>
<text x="684" y="112" text-anchor="middle" font-size="11" style="fill:#fff">7</text>
<circle cx="684" cy="62" r="13" fill="var(--gpio)" stroke="var(--pin)" stroke-width="2"/>
<text x="684" y="66" text-anchor="middle" font-size="11" style="fill:#fff">8</text>
<circle cx="728" cy="108" r="13" fill="var(--gnd)" stroke="var(--pin)" stroke-width="2"/>
<text x="728" y="112" text-anchor="middle" font-size="11" style="fill:#fff">9</text>
<circle cx="728" cy="62" r="13" fill="var(--gpio)" stroke="var(--pin)" stroke-width="2"/>
<text x="728" y="66" text-anchor="middle" font-size="11" style="fill:#fff">10</text>
<circle cx="772" cy="108" r="13" fill="var(--gpio)" stroke="var(--hl)" stroke-width="4"/>
<text x="772" y="112" text-anchor="middle" font-size="11" style="fill:#fff">11</text>
<circle cx="772" cy="62" r="13" fill="var(--gpio)" stroke="var(--pin)" stroke-width="2"/>
<text x="772" y="66" text-anchor="middle" font-size="11" style="fill:#fff">12</text>
<text x="806" y="66" font-size="11" class="ink">even: edge</text>
<text x="806" y="112" font-size="11" class="ink">odd: inner</text>
<g fill="none" stroke-width="5" stroke-linecap="round">
<path d="M157 322 C 157 380, 600 370, 640 123" stroke="var(--sig)"/>
<path d="M149 322 C 145 400, 760 395, 772 123" stroke="var(--sig2)"/>
<path d="M173 322 C 180 360, 520 340, 500 200 C 490 120, 470 14, 630 14 C 640 14, 640 30, 640 47" stroke="var(--gndw)"/>
<path d="M165 322 C 165 345, 120 360, 70 372" stroke="var(--v5)" stroke-dasharray="6 5"/>
</g>
<rect x="56" y="364" width="16" height="14" rx="2" fill="var(--muted)"/>
<g font-size="13">
<text x="80" y="376" style="fill:var(--v5)">red 5V: NOT connected, tape it off</text>
<text x="600" y="210" class="b">yellow · G9 → pin 5 (GPIO3)</text><text x="600" y="228" class="m">WAKE: 200 ms low wakes a halted Pi</text>
<text x="672" y="290" class="b">white · G8 → pin 11 (GPIO17)</text><text x="672" y="308" class="m">SHUTDOWN: 500 ms low = power key</text>
<text x="330" y="140" class="b">black · GND → pin 6</text><text x="330" y="158" class="m">ground is required</text>
</g>
<text x="40" y="412" font-size="12" class="m">Both ESP pins are open-drain: released (high-Z) by default, only ever pulled to ground, never driven high.</text>
</g>
<g transform="translate(0,516)">
<rect x="12" y="0" width="460" height="490" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="32" y="30" font-size="14" class="b">Where the header is (Pi 4, top view)</text>
<g transform="translate(32,52) scale(4.8)">
