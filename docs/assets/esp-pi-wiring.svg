<rect x="7.5" y="51" width="9" height="5.5" rx="1.5" fill="#c9cfcc"/><rect x="22.5" y="51.5" width="7" height="5" rx=".6" fill="#c9cfcc"/><rect x="36" y="51.5" width="7" height="5" rx=".6" fill="#c9cfcc"/>
