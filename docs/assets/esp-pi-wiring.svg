<text x="140" y="170" text-anchor="end" font-size="11">GND</text>
<circle cx="187" cy="166" r="9" fill="var(--gpio)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="187" y="169.5" text-anchor="middle" font-size="9" style="fill:#fff">10</text>
<text x="208" y="170" font-size="11">GPIO15</text>
<circle cx="161" cy="193" r="9" fill="var(--gpio)" stroke="var(--hl)" stroke-width="3"/>
<text x="161" y="196.5" text-anchor="middle" font-size="9" style="fill:#fff">11</text>
<text x="140" y="197" text-anchor="end" font-size="11" class="b">GPIO17</text>
<text x="20" y="197" font-size="10" style="fill:var(--hl)">shutdown</text>
<circle cx="187" cy="193" r="9" fill="var(--gpio)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="187" y="196.5" text-anchor="middle" font-size="9" style="fill:#fff">12</text>
<text x="208" y="197" font-size="11">GPIO18</text>
<circle cx="161" cy="220" r="9" fill="var(--gpio)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="161" y="223.5" text-anchor="middle" font-size="9" style="fill:#fff">13</text>
<text x="140" y="224" text-anchor="end" font-size="11">GPIO27</text>
<circle cx="187" cy="220" r="9" fill="var(--gnd)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="187" y="223.5" text-anchor="middle" font-size="9" style="fill:#fff">14</text>
<text x="208" y="224" font-size="11">GND</text>
<circle cx="161" cy="247" r="9" fill="var(--gpio)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="161" y="250.5" text-anchor="middle" font-size="9" style="fill:#fff">15</text>
<text x="140" y="251" text-anchor="end" font-size="11">GPIO22</text>
<circle cx="187" cy="247" r="9" fill="var(--gpio)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="187" y="250.5" text-anchor="middle" font-size="9" style="fill:#fff">16</text>
<text x="208" y="251" font-size="11">GPIO23</text>
<circle cx="161" cy="274" r="9" fill="var(--v33)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="161" y="277.5" text-anchor="middle" font-size="9" style="fill:#fff">17</text>
<text x="140" y="278" text-anchor="end" font-size="11">3V3</text>
<circle cx="187" cy="274" r="9" fill="var(--gpio)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="187" y="277.5" text-anchor="middle" font-size="9" style="fill:#fff">18</text>
<text x="208" y="278" font-size="11">GPIO24</text>
<circle cx="161" cy="301" r="9" fill="var(--gpio)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="161" y="304.5" text-anchor="middle" font-size="9" style="fill:#fff">19</text>
<text x="140" y="305" text-anchor="end" font-size="11">GPIO10</text>
<circle cx="187" cy="301" r="9" fill="var(--gnd)" stroke="var(--pin)" stroke-width="1.5"/>
<text x="187" y="304.5" text-anchor="middle" font-size="9" style="fill:#fff">20</text>
<text x="208" y="305" font-size="11">GND</text>
<g font-size="12">
<rect x="20" y="340" width="12" height="12" fill="var(--v33)"/><text x="38" y="351">3V3</text>
<rect x="90" y="340" width="12" height="12" fill="var(--v5)"/><text x="108" y="351">5V</text>
<rect x="150" y="340" width="12" height="12" fill="var(--gnd)"/><text x="168" y="351">GND</text>
<rect x="220" y="340" width="12" height="12" fill="var(--gpio)"/><text x="238" y="351">GPIO</text>
<text x="20" y="384" class="b">Pi side (/boot/firmware/config.txt):</text>
<text x="20" y="404">dtoverlay=gpio-shutdown,gpio_pin=17</text>
<text x="20" y="428" class="m">EEPROM: WAKE_ON_GPIO=1, POWER_OFF_ON_HALT=0</text>
<text x="20" y="456" class="m">Never gpio-shutdown on GPIO3: the wake pulse</text>
<text x="20" y="472" class="m">would then shut a running Pi down.</text>
</g></g>
