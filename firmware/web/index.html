<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Satellite WiFi</title>
<!-- /device: the WiFi recovery page (a way back onto WiFi if the UI at / fails). Rendered by
     tools/gen_c_dict.py (the {{ }} placeholders: tools/wifi_consts.py); colours: calictl/webui/app.css. -->
<style>
:root{--bg:#eef1f5;--fg:#1a1d24;--muted:#6b7280;--card:#fff;--border:#e2e6ee;--accent:#2f6fed;--error:#d0453b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1116;--fg:#eef0f4;--muted:#9aa1b0;--card:#1a1d25;--border:#262a34;--error:#ef6b62}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:auto;padding:16px}
h1{font-size:20px;margin:0}
form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:12px 0}
.muted{color:var(--muted)}.bad{color:var(--error)}
label{display:block;margin:10px 0 4px}
select,input,button{font:inherit;width:100%;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg)}
button{background:var(--accent);border-color:var(--accent);color:#fff;margin-top:12px}
#rescan{background:none;color:var(--accent)}
input[type=checkbox]{width:auto;min-height:0;margin-right:6px}
a{color:var(--accent)}[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1 id="h"></h1>
<p id="why" class="muted"></p>
<p id="now" aria-live="polite"></p>
<form id="f">
<label for="ssid" id="l-ssid"></label><select id="ssid"></select>
<input id="name" autocomplete="off" autocapitalize="none" spellcheck="false" hidden>
<label for="psk" id="l-psk"></label><input id="psk" type="password" autocomplete="off">
<label><input id="show" type="checkbox"><span id="l-show"></span></label>
<button id="go"></button><button id="rescan" type="button"></button>
</form>
<p id="msg" aria-live="polite"></p>
<p><a href="/" id="app"></a></p>
</main>
<script>
"use strict";
const L = {
  en: {h: "Satellite WiFi", why: "A way back onto WiFi if the camper UI does not load.", ssid: "Network", other: "Other network…",
    name: "Network name", psk: "Password", show: "Show password", go: "Connect", rescan: "Search again", app: "Open the camper UI",
    station: "Connected to {s} · {ip}", setup: "Setup hotspot {{NET_AP_SSID}}: not on a WiFi network", off: "WiFi off", fail: "last join failed",
    bad_ssid: "Choose a network (1–{{NET_SSID_MAX}} characters).", bad_psk: "The password needs {{NET_PSK_MIN}}–{{NET_PSK_MAX}} characters.",
    store: "Could not save the WiFi settings.", rejected: "The satellite rejected the request.", none: "No answer from the satellite.",
    ok: "Saved — the satellite joins {s} now. Join it with this phone too, then open"},
  de: {h: "Satellit-WLAN", why: "Ein Weg zurück ins WLAN, falls die Camper-Oberfläche nicht lädt.", ssid: "Netzwerk", other: "Anderes Netzwerk…",
    name: "Netzwerkname", psk: "Passwort", show: "Passwort anzeigen", go: "Verbinden", rescan: "Erneut suchen", app: "Camper-Oberfläche öffnen",
    station: "Verbunden mit {s} · {ip}", setup: "Einrichtungs-Hotspot {{NET_AP_SSID}}: in keinem WLAN", off: "WLAN aus", fail: "letzte Verbindung fehlgeschlagen",
    bad_ssid: "Wähle ein Netzwerk (1–{{NET_SSID_MAX}} Zeichen).", bad_psk: "Das Passwort braucht {{NET_PSK_MIN}}–{{NET_PSK_MAX}} Zeichen.",
    store: "Die WLAN-Einstellungen konnten nicht gespeichert werden.", rejected: "Der Satellit hat die Anfrage abgelehnt.", none: "Keine Antwort vom Satelliten.",
    ok: "Gespeichert — der Satellit verbindet sich jetzt mit {s}. Verbinde auch dieses Telefon damit und öffne"}};
const lang = navigator.language.slice(0, 2) === "de" ? "de" : "en", S = /** @type {Record<string, string>} */ (L[lang]);
const $ = (/** @type {string} */ id) => /** @type {HTMLInputElement} */ (document.getElementById(id));
document.documentElement.lang = lang;
document.title = S.h;
for (const k of ["h", "why", "go", "rescan", "app"]) $(k).textContent = S[k];
for (const k of ["ssid", "psk", "show"]) $("l-" + k).textContent = S[k];
$("name").placeholder = S.name;
$("show").onchange = () => { $("psk").type = $("show").checked ? "text" : "password"; };
const other = () => { $("name").hidden = $("ssid").value !== ""; };
$("ssid").onchange = other;
// GET /api/wifi: the mode line + (scan) the list; each GET also starts a (rate-limited) scan
async function read(scan = false) {
  try {
    const w = await (await fetch("/api/wifi", {cache: "no-store"})).json();
    $("now").textContent = S[w.mode].replace("{s}", w.ssid).replace("{ip}", w.ip)
      + (w.mode !== "station" && w.last_error ? " · " + S.fail + " (" + w.last_error + ")" : "");
    if (!scan) return w;
    const sel = $("ssid"), keep = sel.value;
    sel.replaceChildren(...w.scan.filter((/** @type {any} */ a) => a.secure)
      .map((/** @type {any} */ a) => new Option(a.ssid + " (" + a.rssi + " dBm)", a.ssid)), new Option(S.other, ""));
    if (keep) sel.value = keep;
    other();
    return w;
  } catch (e) { $("now").textContent = S.none; return null; }
}
const scan = () => { read(true); setTimeout(read, 4000, true); };
$("rescan").onclick = scan;
$("f").onsubmit = async (ev) => {
  ev.preventDefault();
  const ssid = $("ssid").value || $("name").value.trim(), psk = $("psk").value, msg = $("msg");
  msg.className = "bad";
  if (!ssid || ssid.length > {{NET_SSID_MAX}}) { msg.textContent = S.bad_ssid; return; }
  if (psk.length < {{NET_PSK_MIN}} || psk.length > {{NET_PSK_MAX}}) { msg.textContent = S.bad_psk; return; }
  try {
    const r = await (await fetch("/api/wifi", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ssid: ssid, psk: psk})})).json();
    if (!r.ok) { msg.textContent = r.error === "ssid" ? S.bad_ssid : r.error === "psk" ? S.bad_psk : r.error === "store" ? S.store : S.rejected; return; }
    $("psk").value = "";
    msg.className = "";
    const a = document.createElement("a");
    a.href = a.textContent = "http://{{NET_HOSTNAME}}.local/";
    msg.replaceChildren(S.ok.replace("{s}", ssid) + " ", a);
    for (let i = 0; i < 30; i++) {   // watch the join for a minute: the mode line shows how it ends
      await new Promise((done) => setTimeout(done, {{NET_PAGE_POLL_MS}}));
      const w = await read();
      if (w && w.mode === "station" && w.ssid === ssid) break;
    }
  } catch (e) { msg.textContent = S.none; }
};
scan();
</script>
</body>
</html>
