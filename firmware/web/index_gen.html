<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>calictl-esp</title>
<!-- The ESP32 firmware's WiFi setup page (#154; the status rows moved to the shared UI's Device
     status screen, #267). SOURCE: tools/gen_c_dict.py renders it into
     index_gen.html (the double-brace placeholders: generated constants, the strings.json table and
     the page script from page.js) and strings_gen.h; never edit those. Self-contained: no external
     assets. -->
<style>
:root{--bg:#f6f6f3;--fg:#1d1d1b;--muted:#6b6b66;--card:#fff;--line:#deded8;--accent:#1f6f5c;--bad:#a8322d}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ececea;--muted:#9a9a94;--card:#21211f;--line:#34342f;--accent:#5bbf9f;--bad:#e0716b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:16px;margin:0 0 8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.muted{color:var(--muted)}.bad{color:var(--bad)}
#banner{display:none;background:var(--bad);color:#fff;border-radius:8px;padding:8px 12px;margin:0 0 12px}
label{display:block;margin:10px 0 4px;color:var(--muted)}
select,input,button{font:inherit;width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{background:var(--accent);border-color:var(--accent);color:#fff;margin-top:12px;cursor:pointer}
button.secondary{background:transparent;color:var(--accent)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<div id="banner"></div>
<section id="setup" class="box" hidden>
  <h2 id="setup-title"></h2>
  <p id="setup-hint" class="muted"></p>
  <label for="ssid" id="ssid-label"></label>
  <select id="ssid"></select>
  <label for="psk" id="psk-label"></label>
  <input id="psk" type="password" autocomplete="off">
  <button id="connect" type="button"></button>
  <button id="rescan" class="secondary" type="button"></button>
  <p id="setup-msg"></p>
</section>
<p id="device"></p>
<p id="time" class="muted"></p>
<p id="sd" class="muted"></p>
<p id="res" class="muted"></p>
<section id="ac" class="box">
  <h2 id="ac-title"></h2>
  <p id="ac-status"></p>
  <button id="ac-toggle" class="secondary" type="button" hidden></button>
  <p id="ac-msg" class="bad"></p>
</section>
<section id="fw" class="box">
  <h2 id="fw-title"></h2>
  <p id="fw-status"></p>
  <button id="fw-install" type="button" hidden></button>
  <button id="fw-check" class="secondary" type="button" hidden></button>
  <p id="fw-msg" class="bad"></p>
</section>
</main>
<script>
const CFG = {pollMs: 2000, connectTimeoutMs: 8000, connectRetryMs: 3000, host: "calictl-esp", ssidMax: 32, pskMin: 8, pskMax: 63};
const STR = {"ac_armed":{"de":"⟳ wird beim Parken wiederhergestellt","en":"⟳ will restore on park"},"ac_error":{"de":"Auto-Campingmodus konnte nicht geändert werden","en":"Couldn't change auto camper"},"ac_off":{"de":"Auto-Campingmodus aus","en":"Auto camper off"},"ac_on":{"de":"Auto-Campingmodus an","en":"Auto camper on"},"ac_restoring":{"de":"⟳ wird wiederhergestellt …","en":"⟳ restoring …"},"ac_station_only":{"de":"braucht das Heim-WLAN","en":"needs the home WiFi"},"ac_title":{"de":"Campingmodus nach dem Parken wiederherstellen","en":"Restore camping after you park"},"ac_turn_off":{"de":"Ausschalten","en":"Turn off"},"ac_turn_on":{"de":"Einschalten","en":"Turn on"},"app_link":{"de":"Camper-Oberfläche öffnen","en":"Open the camper UI"},"app_link_pair":{"de":"Camper-Oberfläche öffnen, um die Einheit zu koppeln","en":"Open the camper UI to pair the unit"},"connect":{"de":"Verbinden","en":"Connect"},"device":{"de":"Gerät","en":"Device"},"err_json":{"de":"Das Gerät hat die Anfrage abgelehnt.","en":"The device rejected the request."},"err_net":{"de":"Keine Antwort vom Gerät.","en":"No answer from the device."},"err_psk":{"de":"Das Passwort braucht {min}–{max} Zeichen.","en":"The password needs {min}–{max} characters."},"err_ssid":{"de":"Wähle ein Netzwerk (1–{max} Zeichen).","en":"Choose a network (1–{max} characters)."},"err_store":{"de":"Die WLAN-Einstellungen konnten nicht gespeichert werden.","en":"Could not save the WiFi settings."},"fw_check":{"de":"Nach Update suchen","en":"Check for update"},"fw_install":{"de":"{sha} installieren","en":"Install {sha}"},"fw_running":{"de":"Läuft: {sha}","en":"Running {sha}"},"fw_station_only":{"de":"Updates brauchen das Heim-WLAN.","en":"Updates need the home WiFi."},"fw_title":{"de":"Firmware-Update","en":"Firmware update"},"join_failed_auth":{"de":"Falsches Passwort — versuche es erneut.","en":"Wrong password — try again."},"join_failed_not_found":{"de":"Netzwerk nicht gefunden — prüfe, ob es in Reichweite ist, und versuche es erneut.","en":"Network not found — check that it is in range, then try again."},"join_failed_other":{"de":"Verbindung nicht möglich — versuche es erneut.","en":"Could not join the network — try again."},"joined":{"de":"Verbunden als {ip}. Verbinde auch dieses Gerät mit {ssid} und öffne dann:","en":"Connected as {ip}. Join {ssid} with this device too, then open:"},"joining":{"de":"Verbinde mit {ssid}…","en":"Connecting to {ssid}…"},"network":{"de":"Netzwerk","en":"Network"},"no_networks":{"de":"Keine Netzwerke gefunden","en":"No networks found"},"offline":{"de":"Gerät nicht erreichbar","en":"Device not reachable"},"open_unsupported":{"de":"offenes Netz, nicht unterstützt","en":"open network, not supported"},"ota_available":{"de":"{sha} ist verfügbar","en":"{sha} is available"},"ota_checking":{"de":"suche …","en":"checking …"},"ota_downloading":{"de":"lade {pct} %","en":"downloading {pct} %"},"ota_error":{"de":"Update fehlgeschlagen ({error})","en":"update failed ({error})"},"ota_rebooting":{"de":"installiert, startet neu …","en":"installed, restarting …"},"ota_up_to_date":{"de":"aktuell","en":"up to date"},"ota_verifying":{"de":"prüfe …","en":"verifying …"},"password":{"de":"Passwort","en":"Password"},"res_cpu":{"de":"CPU {pct} %","en":"CPU {pct} %"},"res_psram":{"de":"PSRAM {free} KB frei","en":"PSRAM {free} KB free"},"res_ram":{"de":"RAM {free} KB frei (Minimum {min})","en":"RAM {free} KB free (lowest {min})"},"res_title":{"de":"Ressourcen","en":"Resources"},"rescan":{"de":"Erneut suchen","en":"Search again"},"retrying":{"de":"Verbindung wird erneut versucht…","en":"Retrying the connection…"},"scanning":{"de":"Suche Netzwerke…","en":"Searching for networks…"},"sd_absent":{"de":"Keine SD-Karte","en":"No SD card"},"sd_dropped":{"de":"{n} Einträge verworfen","en":"{n} records dropped"},"sd_error":{"de":"SD-Kartenfehler","en":"SD card error"},"sd_log":{"de":"Log Nr. {seq}","en":"log #{seq}"},"sd_ok":{"de":"SD {free} von {total} GB frei","en":"SD {free} of {total} GB free"},"sd_title":{"de":"Speicher","en":"Storage"},"setup_hint":{"de":"Wähle ein Netzwerk und gib sein Passwort ein.","en":"Choose a network and enter its password."},"setup_title":{"de":"Mit deinem WLAN verbinden","en":"Connect to your WiFi"},"time_none":{"de":"Keine Zeitquelle · Start Nr. {boot}","en":"No clock source · boot {boot}"},"time_synced":{"de":"Uhr synchronisiert (SNTP) · Start Nr. {boot}","en":"Clock synced (SNTP) · boot {boot}"},"time_unit":{"de":"Uhr der Camper-Einheit · Start Nr. {boot}","en":"Clock from the camper unit · boot {boot}"},"time_waiting":{"de":"Uhr noch nicht synchronisiert · Start Nr. {boot}","en":"Clock not synced yet · boot {boot}"},"title":{"de":"Camper-Einrichtung","en":"Camper setup"}};
</script>
<script>
/* page.js — the ESP32 firmware's WiFi setup page script (#154): the provisioning form + a link to the
 * calictl UI, whose Device status screen shows the satellite's status (#267). SOURCE: tools/gen_c_dict.py inlines
 * it into index_gen.html (index.html's PAGE_JS placeholder), right after the script that defines
 * CFG (generated constants) and STR (the strings.json table) — their types: globals.d.ts.
 * Un-built JS: `tools/ci.sh webcheck` type-checks it (tsc --checkJs, jsconfig.json, 0 errors) and
 * tests/firmware/test_web_e2e.py drives it in Chromium. */
// @ts-check
"use strict";

/* The firmware API shapes (firmware/components/cali_core/include/cali_web.h). */
/**
 * @typedef {{ mode: string, ssid: string|null, ip: string|null, rssi: number|null }} Wifi
 * @typedef {{ ssid: string, rssi: number, secure: boolean }} Ap
 * @typedef {Wifi & { last_error: string|null, scan: Ap[] }} WifiGet
 * @typedef {{ state: string, available_sha: string|null, progress_pct: number, error: string|null }} Ota
 * @typedef {{ source: string, synced: boolean, boot: number }} Time
 * @typedef {{ state: string, total_mb: number|null, free_mb: number|null, last_seq: number|null, dropped: number }} Sd
 * @typedef {{ heap_free_kb: number|null, heap_min_kb: number|null, psram_free_kb: number|null, cpu_pct: number|null }} Res
 * @typedef {{ enabled: boolean, state: string }} AutoCamper
 * @typedef {{ pairing: { address: string|null }, wifi: Wifi, fw: string, ota: Ota, time: Time, sd: Sd, res: Res, auto_camper: AutoCamper }} Device  the /api/state fields this page reads
 * @typedef {{ device: Device }} State
 * @typedef {{ ok: boolean, error?: string }} PostResult
 * @typedef {{ ssid: string, polls: number, left: boolean }} Join
 */

const LANG = /^de\b/i.test(navigator.language || "") ? "de" : "en";
/**
 * @param {string} key a strings.json key
 * @param {Record<string, string|number>} [vars] "{name}" substitutions
 * @returns {string}
 */
function t(key, vars) {
  let s = STR[key] ? STR[key][LANG] : key;
  for (const k in vars || {}) s = s.split("{" + k + "}").join(String((vars || {})[k]));
  return s;
}
/* /api/wifi last_error -> the text that says why a join failed */
/** @type {Record<string, string>} */
const JOIN_FAILED = {not_found: "join_failed_not_found", auth: "join_failed_auth", other: "join_failed_other"};
/** @type {Record<string, string>} */
const POST_ERROR = {ssid: "err_ssid", psk: "err_psk", store: "err_store"};
/* device.ota.state -> its text (idle: none) */
/** @type {Record<string, string>} */
const OTA_TEXT = {checking: "ota_checking", up_to_date: "ota_up_to_date", available: "ota_available",
  downloading: "ota_downloading", verifying: "ota_verifying", rebooting: "ota_rebooting", error: "ota_error"};

/**
 * @param {string} id
 * @returns {HTMLElement} the element (index.html has every id this script uses)
 */
function $(id) {
  const e = document.getElementById(id);
  if (!e) throw new Error("missing #" + id);
  return e;
}
/** @param {string} id @returns {HTMLInputElement} */
const input = (id) => /** @type {HTMLInputElement} */ ($(id));
/** @param {string} id @returns {HTMLSelectElement} */
const select = (id) => /** @type {HTMLSelectElement} */ ($(id));
/**
 * @template {keyof HTMLElementTagNameMap} K
 * @param {K} tag
 * @param {string} [text]
 * @param {string} [cls]
 * @returns {HTMLElementTagNameMap[K]}
 */
function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
/**
 * @template T
 * @param {string} url
 * @param {RequestInit} [opts]
 * @returns {Promise<{status: number, body: T}>}
 */
async function fetchJson(url, opts) {
  const r = await fetch(url, Object.assign({cache: "no-store"}, opts));
  return {status: r.status, body: await r.json()};
}
/** @returns {Promise<WifiGet>} */
async function getWifi() {
  return (/** @type {{body: WifiGet}} */ (await fetchJson("/api/wifi"))).body;
}

$("title").textContent = t("title");
$("setup-title").textContent = t("setup_title");
$("setup-hint").textContent = t("setup_hint");
$("ssid-label").textContent = t("network");
$("psk-label").textContent = t("password");
$("connect").textContent = t("connect");
$("rescan").textContent = t("rescan");
$("fw-title").textContent = t("fw_title");
$("ac-title").textContent = t("ac_title");
$("fw-check").textContent = t("fw_check");
document.documentElement.lang = LANG;

/** @type {Join|null} a submitted join being watched */
let joining = null;

/** @param {Device} d */
function renderLink(d) {
  /* the calictl web UI: GET / in station mode; elsewhere (the setup hotspot) GET /app, where its
   * pairing wizard pairs the unit without home WiFi */
  const box = $("device"), station = d.wifi.mode === "station";
  box.textContent = "";
  const a = el("a", t(station || d.pairing.address ? "app_link" : "app_link_pair"));
  a.href = station ? "/" : "/app";
  box.appendChild(a);
}

/* The clock the SD log stamps with (R_FW_TIME): SNTP synced or not, and the boot number. */
/** @param {Time} c */
function renderTime(c) {
  const key = c.source === "none" ? "time_none" : c.source === "unit" ? "time_unit" : c.synced ? "time_synced" : "time_waiting";
  $("time").textContent = t(key, {boot: c.boot});
}

/* The SD log's card (R_FW_SD_LOG): "Storage: SD 28.1 of 29.7 GB free · log #1042 · 3 records dropped". */
/** @param {Sd} sd */
function renderSd(sd) {
  /** @param {number|null} mb */
  const gb = (mb) => ((mb || 0) / 1024).toFixed(1);
  const parts = [sd.state === "ok" ? t("sd_ok", {free: gb(sd.free_mb), total: gb(sd.total_mb)})
    : t(sd.state === "error" ? "sd_error" : "sd_absent")];
  if (sd.state === "ok" && sd.last_seq !== null) parts.push(t("sd_log", {seq: sd.last_seq}));
  if (sd.dropped > 0) parts.push(t("sd_dropped", {n: sd.dropped}));
  $("sd").textContent = t("sd_title") + ": " + parts.join(" · ");
}

/* The satellite's own resources: internal RAM free (lowest since boot), PSRAM free, CPU busy. */
/** @param {Res} r */
function renderRes(r) {
  const parts = [];
  if (r.heap_free_kb !== null) parts.push(t("res_ram", {free: r.heap_free_kb, min: r.heap_min_kb ?? "?"}));
  if (r.psram_free_kb !== null) parts.push(t("res_psram", {free: r.psram_free_kb}));
  if (r.cpu_pct !== null) parts.push(t("res_cpu", {pct: r.cpu_pct}));
  $("res").textContent = parts.length ? t("res_title") + ": " + parts.join(" · ") : "";
}

/* The firmware row (R_FW_OTA): the running build, the update's progress, Check / Install <sha7>
 * (station mode only, like the firmware's POST /api/ota). */
/** @param {Device} d */
function renderFw(d) {
  const o = d.ota, sha = (o.available_sha || "").slice(0, 7), key = OTA_TEXT[o.state];
  const station = d.wifi.mode === "station", busy = ["checking", "downloading", "verifying", "rebooting"].includes(o.state);
  let text = t("fw_running", {sha: d.fw});
  if (key) text += " · " + t(key, {sha: sha, pct: o.progress_pct, error: o.error || ""});
  if (!station) text += " · " + t("fw_station_only");
  $("fw-status").textContent = text;
  $("fw-check").hidden = !station || busy;
  const install = $("fw-install");
  install.hidden = !station || busy || !sha;
  install.textContent = t("fw_install", {sha: sha});
}

/* Auto camper (R_FW_AUTO_CAMPER): on/off, a restore owed, the toggle (station mode only) */
/** @param {Device} d */
function renderAutoCamper(d) {
  const a = d.auto_camper, st = d.wifi.mode === "station", b = $("ac-toggle");
  $("ac-status").textContent = [t(a.enabled ? "ac_on" : "ac_off"), a.state === "armed" ? t("ac_armed") : "",
    a.state === "restoring" ? t("ac_restoring") : "", st ? "" : t("ac_station_only")].filter(Boolean).join(" · ");
  b.hidden = !st;
  b.textContent = t(a.enabled ? "ac_turn_off" : "ac_turn_on");
  b.dataset.on = a.enabled ? "1" : "";
}

async function toggleAutoCamper() {
  const b = $("ac-toggle"), msg = $("ac-msg");
  msg.textContent = "";
  b.hidden = true;   /* the next poll shows it again */
  let ok = false;
  try {
    ok = (/** @type {{body: PostResult}} */ (await fetchJson("/api/auto_camper", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({enabled: !b.dataset.on})}))).body.ok;
  } catch (e) { /* ok stays false */ }
  if (!ok) msg.textContent = t("ac_error");
}

/** @param {"check"|"install"} action */
async function ota(action) {
  const msg = $("fw-msg");
  msg.textContent = "";
  /* no second click while this one is in flight: the next poll shows the buttons again (busy -> not) */
  $("fw-check").hidden = $("fw-install").hidden = true;
  try {
    const r = /** @type {{body: PostResult}} */ (await fetchJson("/api/ota", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({action: action})}));
    if (!r.body.ok) msg.textContent = t("ota_error", {error: r.body.error || ""});
  } catch (e) { msg.textContent = t("err_net"); }
}

/** @param {Ap[]} scan */
function renderNetworks(scan) {
  const sel = select("ssid"), keep = sel.value;
  sel.textContent = "";
  if (!scan.length) { sel.appendChild(el("option", t("no_networks"))).value = ""; return; }
  for (const ap of scan) {
    const o = el("option", ap.ssid + "  (" + ap.rssi + " dBm" + (ap.secure ? "" : ", " + t("open_unsupported")) + ")");
    o.value = ap.ssid;
    o.disabled = !ap.secure;  /* the device requires a NET_PSK_MIN..NET_PSK_MAX passphrase */
    sel.appendChild(o);
  }
  if (scan.some((ap) => ap.ssid === keep)) sel.value = keep;
}

/** @type {ReturnType<typeof setTimeout>|null} the pending delayed re-read from the last scan() */
let scanTimer = null;

async function scan() {
  const msg = $("setup-msg");
  if (scanTimer !== null) { clearTimeout(scanTimer); scanTimer = null; }
  msg.className = "";
  msg.textContent = t("scanning");
  const still = () => msg.textContent === t("scanning");  /* nothing newer (join result, error) landed */
  try {
    renderNetworks((await getWifi()).scan);
    /* each GET starts a fresh scan for the next one: read its result a moment later */
    scanTimer = setTimeout(async () => {
      scanTimer = null;
      try { renderNetworks((await getWifi()).scan); if (still()) msg.textContent = ""; }
      catch (e) { if (still()) msg.textContent = t("err_net"); }
    }, 2 * CFG.pollMs);
  } catch (e) { if (still()) msg.textContent = t("err_net"); }
}

async function connect() {
  const ssid = select("ssid").value, psk = input("psk").value, msg = $("setup-msg");
  if (scanTimer !== null) { clearTimeout(scanTimer); scanTimer = null; }
  msg.className = "bad";
  if (!ssid || ssid.length > CFG.ssidMax) { msg.textContent = t("err_ssid", {max: CFG.ssidMax}); return; }
  if (psk.length < CFG.pskMin || psk.length > CFG.pskMax) {
    msg.textContent = t("err_psk", {min: CFG.pskMin, max: CFG.pskMax}); return;
  }
  /* a hanging POST (answers lost, connection still open) ends after CFG.connectTimeoutMs: the retry path */
  const send = () => {
    const ac = new AbortController(), timer = setTimeout(() => ac.abort(), CFG.connectTimeoutMs);
    return fetch("/api/wifi", {cache: "no-store", method: "POST", signal: ac.signal,
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({ssid: ssid, psk: psk})})
      .finally(() => clearTimeout(timer));
  };
  try {
    let res;
    try { res = await send(); }
    catch (e) {
      /* no answer: the phone can drop off the setup hotspot for a moment (the shared radio scans or
       * switches channel) — say so, wait, and try once more */
      msg.className = "";
      msg.textContent = t("retrying");
      await new Promise((done) => setTimeout(done, CFG.connectRetryMs));
      msg.className = "bad";
      res = await send();
    }
    const r = {body: /** @type {PostResult} */ (await res.json())};
    if (!r.body.ok) {
      const e = POST_ERROR[r.body.error || ""] || "err_json";
      msg.textContent = t(e, {max: e === "err_ssid" ? CFG.ssidMax : CFG.pskMax, min: CFG.pskMin});
      return;
    }
    input("psk").value = "";
    msg.className = "";
    msg.textContent = t("joining", {ssid: ssid});
    joining = {ssid: ssid, polls: 0, left: false};
  } catch (e) { msg.textContent = t("err_net"); }
}

/** @param {Join} j the join being watched */
async function watchJoin(j) {
  const msg = $("setup-msg");
  const w = await getWifi();
  j.polls++;
  if (w.mode !== "setup") j.left = true;
  if (w.mode === "station" && w.ip) {
    msg.className = "";
    msg.textContent = t("joined", {ip: w.ip, ssid: j.ssid}) + " ";
    const url = "http://" + CFG.host + ".local";
    const a = el("a", url);
    a.href = url;
    msg.appendChild(a);
    joining = null;
  } else if (w.mode === "setup" && (j.left || j.polls > 3)) {
    msg.className = "bad";
    /* why it failed (/api/wifi last_error): out of range, a typo, or anything else */
    msg.textContent = t(JOIN_FAILED[w.last_error || ""] || "join_failed_other");
    joining = null;
  }
}

let setupShown = false;
async function poll() {
  try {
    if (joining) await watchJoin(joining);
    const s = (/** @type {{body: State}} */ (await fetchJson("/api/state"))).body;
    $("banner").style.display = "none";
    renderLink(s.device);
    renderFw(s.device);
    renderAutoCamper(s.device);
    renderTime(s.device.time);
    renderSd(s.device.sd);
    renderRes(s.device.res);
    const setup = s.device.wifi.mode === "setup" || joining !== null || $("setup-msg").querySelector("a") !== null;
    $("setup").hidden = !setup;
    if (setup && !setupShown && !joining) scan();
    setupShown = setup;
  } catch (e) {
    $("banner").textContent = t("offline");
    $("banner").style.display = "block";
  }
  setTimeout(poll, CFG.pollMs);
}

$("connect").addEventListener("click", connect);
$("rescan").addEventListener("click", scan);
$("ac-toggle").addEventListener("click", toggleAutoCamper);
$("fw-check").addEventListener("click", () => ota("check"));
$("fw-install").addEventListener("click", () => ota("install"));
poll();
</script>
</body>
</html>
