<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>calictl-esp</title>
<!-- The ESP32 firmware's WiFi setup page (#154; the status rows moved to the shared UI's Device
     status screen, #267). SOURCE: tools/gen_c_dict.py renders it into
     index_gen.html (the double-brace placeholders: generated constants, the strings.json table and
     the page script from page.js) and strings_gen.h; never edit those. Self-contained: no external
     assets. -->
<style>
:root{--bg:#f6f6f3;--fg:#1d1d1b;--muted:#6b6b66;--card:#fff;--line:#deded8;--accent:#1f6f5c;--bad:#a8322d}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ececea;--muted:#9a9a94;--card:#21211f;--line:#34342f;--accent:#5bbf9f;--bad:#e0716b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:16px;margin:0 0 8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.muted{color:var(--muted)}.bad{color:var(--bad)}
#banner{display:none;background:var(--bad);color:#fff;border-radius:8px;padding:8px 12px;margin:0 0 12px}
label{display:block;margin:10px 0 4px;color:var(--muted)}
select,input,button{font:inherit;width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{background:var(--accent);border-color:var(--accent);color:#fff;margin-top:12px;cursor:pointer}
button.secondary{background:transparent;color:var(--accent)}
a{color:var(--accent)}
#scr input{width:auto;margin-right:6px}#scr button{width:3em;margin:0 8px}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<div id="banner"></div>
<section id="setup" class="box" hidden>
  <h2 id="setup-title"></h2>
  <p id="setup-hint" class="muted"></p>
  <label for="ssid" id="ssid-label"></label>
  <select id="ssid"></select>
  <label for="psk" id="psk-label"></label>
  <input id="psk" type="password" autocomplete="off">
  <button id="connect" type="button"></button>
  <button id="rescan" class="secondary" type="button"></button>
  <p id="setup-msg"></p>
</section>
<p id="device"></p>
<p id="time" class="muted"></p>
<p id="sd" class="muted"></p>
<p id="res" class="muted"></p>
<p id="battery" class="muted"></p>
<section id="ac" class="box">
  <h2 id="ac-title"></h2>
  <p id="ac-status"></p>
  <button id="ac-toggle" class="secondary" type="button" hidden></button>
  <p id="ac-msg" class="bad"></p>
</section>
<section id="scr" class="box" hidden>
  <h2 id="scr-title"></h2>
  <p id="scr-status"></p>
  <label><input id="scr-auto" type="checkbox"><span id="scr-auto-l"></span></label>
  <label><input id="scr-prox" type="checkbox"><span id="scr-prox-l"></span></label>
  <label><input id="scr-motion" type="checkbox"><span id="scr-motion-l"></span></label>
  <p><button id="scr-dn" class="secondary">−</button><span id="scr-off"></span><button id="scr-up" class="secondary">+</button></p>
</section>
<p id="ux"><span id="ux-status"></span> <button id="ux-toggle" class="secondary" type="button" hidden></button></p>
<p id="ux-msg" class="bad"></p>
<section id="exp" class="box">
  <h2 id="exp-title"></h2>
  <p id="exp-hint" class="muted"></p>
  <p id="exp-status"></p>
  <button id="exp-toggle" class="secondary" type="button" hidden></button>
  <p id="exp-msg" class="bad"></p>
</section>
<section id="sens" class="box" hidden>
  <h2 id="sens-title"></h2>
  <p id="sens-hint" class="muted"></p>
  <div id="sens-cfg"></div>
  <div id="sens-seen"></div>
  <p id="sens-msg" class="bad"></p>
</section>
<section id="fw" class="box">
  <h2 id="fw-title"></h2>
  <p id="fw-status"></p>
  <button id="fw-install" type="button" hidden></button>
  <button id="fw-check" class="secondary" type="button" hidden></button>
  <label for="fw-channel" id="fw-channel-l" hidden></label><select id="fw-channel" hidden><option value="stable"></option><option value="latest"></option></select>
  <p id="fw-msg" class="bad"></p>
</section>
</main>
<script>
const CFG = {pollMs: 2000, connectTimeoutMs: 8000, connectRetryMs: 3000, host: "calictl-esp", ssidMax: 32, pskMin: 8, pskMax: 63};
const STR = {"ac_armed":{"de":"⟳ wird beim Parken wiederhergestellt","en":"⟳ will restore on park"},"ac_error":{"de":"Auto-Campingmodus konnte nicht geändert werden","en":"Couldn't change auto camper"},"ac_off":{"de":"Auto-Campingmodus aus","en":"Auto camper off"},"ac_on":{"de":"Auto-Campingmodus an","en":"Auto camper on"},"ac_restoring":{"de":"⟳ wird wiederhergestellt …","en":"⟳ restoring …"},"ac_station_only":{"de":"braucht das Heim-WLAN","en":"needs the home WiFi"},"ac_title":{"de":"Campingmodus nach dem Parken wiederherstellen","en":"Restore camping after you park"},"ac_turn_off":{"de":"Ausschalten","en":"Turn off"},"ac_turn_on":{"de":"Einschalten","en":"Turn on"},"app_link":{"de":"Camper-Oberfläche öffnen","en":"Open the camper UI"},"app_link_pair":{"de":"Camper-Oberfläche öffnen, um die Einheit zu koppeln","en":"Open the camper UI to pair the unit"},"batt_charging":{"de":"an USB, lädt","en":"on USB, charging"},"batt_left":{"de":"noch ~{time}","en":"~{time} left"},"batt_on":{"de":"im Akkubetrieb","en":"on battery"},"batt_title":{"de":"Akku","en":"Battery"},"batt_usb":{"de":"an USB","en":"on USB"},"connect":{"de":"Verbinden","en":"Connect"},"device":{"de":"Gerät","en":"Device"},"err_json":{"de":"Das Gerät hat die Anfrage abgelehnt.","en":"The device rejected the request."},"err_net":{"de":"Keine Antwort vom Gerät.","en":"No answer from the device."},"err_psk":{"de":"Das Passwort braucht {min}–{max} Zeichen.","en":"The password needs {min}–{max} characters."},"err_ssid":{"de":"Wähle ein Netzwerk (1–{max} Zeichen).","en":"Choose a network (1–{max} characters)."},"err_store":{"de":"Die WLAN-Einstellungen konnten nicht gespeichert werden.","en":"Could not save the WiFi settings."},"exp_error":{"de":"Schalter konnte nicht geändert werden","en":"Couldn't change the switch"},"exp_hint":{"de":"Schaltet Sensorsuche und -einrichtung frei. Stabile Funktionen hängen nicht davon ab.","en":"Enables the sensor scan and setup. Stable features do not depend on it."},"exp_off":{"de":"Sensoren (experimentell): aus","en":"Sensors (experimental): off"},"exp_on":{"de":"Sensoren (experimentell): an","en":"Sensors (experimental): on"},"exp_title":{"de":"Experimentell","en":"Experimental"},"fw_ch_error":{"de":"Kanal konnte nicht geändert werden","en":"Couldn't change the channel"},"fw_ch_latest":{"de":"neueste (jeder Merge)","en":"latest (every merge)"},"fw_ch_stable":{"de":"stabil (getestet)","en":"stable (tested)"},"fw_channel":{"de":"Kanal","en":"Channel"},"fw_check":{"de":"Nach Update suchen","en":"Check for update"},"fw_install":{"de":"{sha} installieren","en":"Install {sha}"},"fw_running":{"de":"Läuft: {sha}","en":"Running {sha}"},"fw_station_only":{"de":"Updates brauchen das Heim-WLAN.","en":"Updates need the home WiFi."},"fw_title":{"de":"Firmware-Update","en":"Firmware update"},"join_failed_auth":{"de":"Falsches Passwort — versuche es erneut.","en":"Wrong password — try again."},"join_failed_not_found":{"de":"Netzwerk nicht gefunden — prüfe, ob es in Reichweite ist, und versuche es erneut.","en":"Network not found — check that it is in range, then try again."},"join_failed_other":{"de":"Verbindung nicht möglich — versuche es erneut.","en":"Could not join the network — try again."},"joined":{"de":"Verbunden als {ip}. Verbinde auch dieses Gerät mit {ssid} und öffne dann:","en":"Connected as {ip}. Join {ssid} with this device too, then open:"},"joining":{"de":"Verbinde mit {ssid}…","en":"Connecting to {ssid}…"},"network":{"de":"Netzwerk","en":"Network"},"no_networks":{"de":"Keine Netzwerke gefunden","en":"No networks found"},"offline":{"de":"Gerät nicht erreichbar","en":"Device not reachable"},"open_unsupported":{"de":"offenes Netz, nicht unterstützt","en":"open network, not supported"},"ota_available":{"de":"{sha} ist verfügbar","en":"{sha} is available"},"ota_checking":{"de":"suche …","en":"checking …"},"ota_downloading":{"de":"lade {pct} %","en":"downloading {pct} %"},"ota_error":{"de":"Update fehlgeschlagen ({error})","en":"update failed ({error})"},"ota_rebooting":{"de":"installiert, startet neu …","en":"installed, restarting …"},"ota_up_to_date":{"de":"aktuell","en":"up to date"},"ota_verifying":{"de":"prüfe …","en":"verifying …"},"password":{"de":"Passwort","en":"Password"},"res_cpu":{"de":"CPU {pct} %","en":"CPU {pct} %"},"res_psram":{"de":"PSRAM {free} KB frei","en":"PSRAM {free} KB free"},"res_ram":{"de":"RAM {free} KB frei (Minimum {min})","en":"RAM {free} KB free (lowest {min})"},"res_title":{"de":"Ressourcen","en":"Resources"},"rescan":{"de":"Erneut suchen","en":"Search again"},"retrying":{"de":"Verbindung wird erneut versucht…","en":"Retrying the connection…"},"scanning":{"de":"Suche Netzwerke…","en":"Searching for networks…"},"scr_auto":{"de":"Helligkeit nach Raumlicht","en":"Brightness from room light"},"scr_dim":{"de":"gedimmt","en":"dimmed"},"scr_motion":{"de":"Bei Bewegung einschalten","en":"Wake on motion"},"scr_nolux":{"de":"kein Lichtsensor-Wert","en":"no light sensor reading"},"scr_off":{"de":"aus","en":"off"},"scr_offset":{"de":"Helligkeit {n}","en":"Brightness {n}"},"scr_on":{"de":"an","en":"on"},"scr_prox":{"de":"Bei Annäherung einschalten","en":"Wake when a hand is near"},"scr_title":{"de":"Bildschirm","en":"Screen"},"sd_absent":{"de":"Keine SD-Karte","en":"No SD card"},"sd_dropped":{"de":"{n} Einträge verworfen","en":"{n} records dropped"},"sd_error":{"de":"SD-Kartenfehler","en":"SD card error"},"sd_log":{"de":"Log Nr. {seq}","en":"log #{seq}"},"sd_ok":{"de":"SD {free} von {total} GB frei","en":"SD {free} of {total} GB free"},"sd_title":{"de":"Speicher","en":"Storage"},"sens_add":{"de":"Hinzufügen","en":"Add"},"sens_alias":{"de":"Name (a–z, 0–9, -, _)","en":"Name (a–z, 0–9, -, _)"},"sens_confirm_remove":{"de":"{alias} entfernen?","en":"Remove {alias}?"},"sens_err_bad_alias":{"de":"Name vergeben oder ungültig","en":"Name taken or invalid"},"sens_err_bad_key":{"de":"Schlüssel muss 32 Hex-Zeichen haben","en":"Key must be 32 hex digits"},"sens_err_full":{"de":"Sensorliste ist voll (16)","en":"Sensor list is full (16)"},"sens_err_key_mismatch":{"de":"Schlüssel passt nicht zu diesem Gerät","en":"Key does not match this device"},"sens_error":{"de":"Sensoren konnten nicht geändert werden","en":"Couldn't change the sensors"},"sens_hint":{"de":"Sensoren in der Nähe erscheinen unten; füge deine hinzu.","en":"Nearby sensors appear below; add the ones that are yours."},"sens_key":{"de":"Verschlüsselungsschlüssel (32 Hex-Zeichen)","en":"Encryption key (32 hex digits)"},"sens_none":{"de":"Noch keine Sensoren gefunden (die Suche läuft jede Minute).","en":"No sensors found yet (the scan runs every minute)."},"sens_paused":{"de":"Suche pausiert während der Kopplung","en":"Scan paused while pairing"},"sens_remove":{"de":"Entfernen","en":"Remove"},"sens_t_govee":{"de":"Thermo-Hygrometer (Govee)","en":"Thermo-hygrometer (Govee)"},"sens_t_victron_battery":{"de":"Batteriesensor (Victron)","en":"Battery sense (Victron)"},"sens_t_victron_mppt":{"de":"Solarladeregler (Victron)","en":"Solar charger (Victron)"},"sens_title":{"de":"Sensoren","en":"Sensors"},"setup_hint":{"de":"Wähle ein Netzwerk und gib sein Passwort ein.","en":"Choose a network and enter its password."},"setup_title":{"de":"Mit deinem WLAN verbinden","en":"Connect to your WiFi"},"time_none":{"de":"Keine Zeitquelle · Start Nr. {boot}","en":"No clock source · boot {boot}"},"time_synced":{"de":"Uhr synchronisiert (SNTP) · Start Nr. {boot}","en":"Clock synced (SNTP) · boot {boot}"},"time_unit":{"de":"Uhr der Camper-Einheit · Start Nr. {boot}","en":"Clock from the camper unit · boot {boot}"},"time_waiting":{"de":"Uhr noch nicht synchronisiert · Start Nr. {boot}","en":"Clock not synced yet · boot {boot}"},"title":{"de":"Camper-Einrichtung","en":"Camper setup"},"ux_error":{"de":"Nutzungsdaten konnten nicht geändert werden","en":"Couldn't change usage data"},"ux_off":{"de":"Nutzungsdaten senden: aus","en":"Send usage data: off"},"ux_on":{"de":"Nutzungsdaten senden: an","en":"Send usage data: on"}};
</script>
<script>
"use strict";


const LANG = /^de\b/i.test(navigator.language || "") ? "de" : "en";
function t(key, vars) {
  let s = STR[key] ? STR[key][LANG] : key;
  for (const k in vars || {}) s = s.split("{" + k + "}").join(String((vars || {})[k]));
  return s;
}
const JOIN_FAILED = {not_found: "join_failed_not_found", auth: "join_failed_auth", other: "join_failed_other"};
const POST_ERROR = {ssid: "err_ssid", psk: "err_psk", store: "err_store"};
const OTA_TEXT = {checking: "ota_checking", up_to_date: "ota_up_to_date", available: "ota_available",
  downloading: "ota_downloading", verifying: "ota_verifying", rebooting: "ota_rebooting", error: "ota_error"};

function $(id) {
  const e = document.getElementById(id);
  if (!e) throw new Error("missing #" + id);
  return e;
}
const input = (id) => /** @type {HTMLInputElement} */ ($(id));
const select = (id) => /** @type {HTMLSelectElement} */ ($(id));
function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
async function fetchJson(url, opts) {
  const r = await fetch(url, Object.assign({cache: "no-store"}, opts));
  return {status: r.status, body: await r.json()};
}
async function getWifi() {
  return (/** @type {{body: WifiGet}} */ (await fetchJson("/api/wifi"))).body;
}

$("title").textContent = t("title");
$("setup-title").textContent = t("setup_title");
$("setup-hint").textContent = t("setup_hint");
$("ssid-label").textContent = t("network");
$("psk-label").textContent = t("password");
$("connect").textContent = t("connect");
$("rescan").textContent = t("rescan");
$("fw-title").textContent = t("fw_title");
$("ac-title").textContent = t("ac_title");
$("fw-check").textContent = t("fw_check");
$("fw-channel-l").textContent = t("fw_channel");
select("fw-channel").options[0].textContent = t("fw_ch_stable");
select("fw-channel").options[1].textContent = t("fw_ch_latest");
$("scr-title").textContent = t("scr_title");
$("exp-title").textContent = t("exp_title");
$("exp-hint").textContent = t("exp_hint");
$("sens-title").textContent = t("sens_title");
$("sens-hint").textContent = t("sens_hint");
$("scr-auto-l").textContent = t("scr_auto");
$("scr-prox-l").textContent = t("scr_prox");
$("scr-motion-l").textContent = t("scr_motion");
document.documentElement.lang = LANG;

let joining = null;

function renderLink(d) {
  const box = $("device"), station = d.wifi.mode === "station";
  box.textContent = "";
  const a = el("a", t(station || d.pairing.address ? "app_link" : "app_link_pair"));
  a.href = station ? "/" : "/app";
  box.appendChild(a);
}

function renderTime(c) {
  const key = c.source === "none" ? "time_none" : c.source === "unit" ? "time_unit" : c.synced ? "time_synced" : "time_waiting";
  $("time").textContent = t(key, {boot: c.boot});
}

function renderSd(sd) {
  const gb = (mb) => ((mb || 0) / 1024).toFixed(1);
  const parts = [sd.state === "ok" ? t("sd_ok", {free: gb(sd.free_mb), total: gb(sd.total_mb)})
    : t(sd.state === "error" ? "sd_error" : "sd_absent")];
  if (sd.state === "ok" && sd.last_seq !== null) parts.push(t("sd_log", {seq: sd.last_seq}));
  if (sd.dropped > 0) parts.push(t("sd_dropped", {n: sd.dropped}));
  $("sd").textContent = t("sd_title") + ": " + parts.join(" · ");
}

function renderRes(r) {
  const parts = [];
  if (r.heap_free_kb !== null) parts.push(t("res_ram", {free: r.heap_free_kb, min: r.heap_min_kb ?? "?"}));
  if (r.psram_free_kb !== null) parts.push(t("res_psram", {free: r.psram_free_kb}));
  if (r.cpu_pct !== null) parts.push(t("res_cpu", {pct: r.cpu_pct}));
  $("res").textContent = parts.length ? t("res_title") + ": " + parts.join(" · ") : "";
}

function renderBattery(b) {
  if (b.pct === null) { $("battery").textContent = ""; return; }
  const parts = [b.pct + " %"];
  if (b.mv !== null) parts.push((b.mv / 1000).toFixed(2) + " V");
  if (b.usb !== null) parts.push(t(b.usb ? (b.charging ? "batt_charging" : "batt_usb") : "batt_on"));
  if (!b.usb && b.runtime_min !== null) {
    const h = Math.floor(b.runtime_min / 60), m = b.runtime_min % 60;
    parts.push(t("batt_left", {time: h ? h + " h " + m + " min" : m + " min"}));
  }
  $("battery").textContent = t("batt_title") + ": " + parts.join(" · ");
}

function renderFw(d) {
  const o = d.ota, sha = (o.available_sha || "").slice(0, 7), key = OTA_TEXT[o.state];
  const station = d.wifi.mode === "station", busy = ["checking", "downloading", "verifying", "rebooting"].includes(o.state);
  let text = t("fw_running", {sha: d.fw}) + " · " + t(o.channel === "latest" ? "fw_ch_latest" : "fw_ch_stable");
  if (key) text += " · " + t(key, {sha: sha, pct: o.progress_pct, error: o.error || ""});
  if (!station) text += " · " + t("fw_station_only");
  $("fw-status").textContent = text;
  $("fw-check").hidden = !station || busy;
  const install = $("fw-install");
  install.hidden = !station || busy || !sha;
  install.textContent = t("fw_install", {sha: sha});
  const sel = select("fw-channel");
  sel.hidden = $("fw-channel-l").hidden = !station || busy;
  sel.dataset.v = o.channel;
  if (document.activeElement !== sel) sel.value = o.channel;
}

function renderAutoCamper(d) {
  const a = d.auto_camper, st = d.wifi.mode === "station", b = $("ac-toggle");
  $("ac-status").textContent = [t(a.enabled ? "ac_on" : "ac_off"), a.state === "armed" ? t("ac_armed") : "",
    a.state === "restoring" ? t("ac_restoring") : "", st ? "" : t("ac_station_only")].filter(Boolean).join(" · ");
  b.hidden = !st;
  b.textContent = t(a.enabled ? "ac_turn_off" : "ac_turn_on");
  b.dataset.on = a.enabled ? "1" : "";
}

function renderUx(d) {
  const on = !!(d.ux && d.ux.enabled), b = $("ux-toggle");
  $("ux-status").textContent = t(on ? "ux_on" : "ux_off");
  b.hidden = d.wifi.mode !== "station";
  b.textContent = t(on ? "ac_turn_off" : "ac_turn_on");
  b.dataset.on = on ? "1" : "";
}

function renderExp(d) {
  const on = !!(d.experimental && d.experimental.sensors), b = $("exp-toggle");
  $("exp-status").textContent = t(on ? "exp_on" : "exp_off");
  b.hidden = d.wifi.mode !== "station";
  b.textContent = t(on ? "ac_turn_off" : "ac_turn_on");
  b.dataset.on = on ? "1" : "";
}

async function toggle(path, id, err, key) {
  const b = $(id + "-toggle"), msg = $(id + "-msg");
  msg.textContent = "";
  b.hidden = true;   /* the next poll shows it again */
  let ok = false;
  try {
    ok = (/** @type {{body: PostResult}} */ (await fetchJson(path, {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({[key || "enabled"]: !b.dataset.on})}))).body.ok;
  } catch (e) { /* ok stays false */ }
  if (!ok) msg.textContent = t(err);
}

const SENS_T = {govee: "sens_t_govee", victron_mppt: "sens_t_victron_mppt", victron_battery: "sens_t_victron_battery"};
const SENS_ERR = {bad_alias: "sens_err_bad_alias", bad_key: "sens_err_bad_key", key_mismatch: "sens_err_key_mismatch", full: "sens_err_full"};
let sensOn = false;
function renderSensors(d) {
  $("sens").hidden = !(d.experimental && d.experimental.sensors);
  if (!$("sens").hidden && !sensOn) { sensOn = true; pollSensors(); }
}
async function pollSensors() {
  if (sensOn = !$("sens").hidden) {
    try { renderSens((/** @type {{body: Sensors}} */ (await fetchJson("/api/sensors"))).body); } catch (e) { /* next poll */ }
    setTimeout(pollSensors, 10000);
  }
}
function renderSens(s) {
  const cfg = $("sens-cfg"), seen = $("sens-seen");
  cfg.textContent = "";
  for (const c of s.configured) {
    const v = c.value ? Object.entries(c.value).slice(0, 2).map((e) => e.join("=")).join(" ") : "—";
    const p = cfg.appendChild(el("p", [c.alias, v, c.last_seen_s === null ? "—" : c.last_seen_s + " s"].join(" · ") + " ", "row"));
    p.appendChild(el("button", t("sens_remove"), "secondary")).onclick = () =>
      confirm(t("sens_confirm_remove", {alias: c.alias})) && sensPost({remove: c.id});
  }
  if (seen.querySelector("input")) return;   /* a key or name being typed */
  seen.textContent = "";
  if (s.scan === "paused" || !s.seen.length) seen.appendChild(el("p", t(s.scan === "paused" ? "sens_paused" : "sens_none"), "muted"));
  for (const r of s.seen) {
    const p = seen.appendChild(el("p", [t(SENS_T[r.type] || r.type), r.model, r.rssi + " dBm"].join(" · ") + " ", "row"));
    const b = p.appendChild(el("button", t("sens_add")));
    const need = [];
    if (r.type.startsWith("victron")) need.push(["key", "sens_key", "password"]);
    if (s.configured.some((c) => c.type === r.type)) need.push(["alias", "sens_alias", "text"]);
    b.onclick = () => {
      const ins = p.querySelectorAll("input");
      const o = {add: r.id};
      need.forEach(([k, ph, ty], i) => {
        if (ins[i]) o[k] = ins[i].value;
        else { const n = p.insertBefore(el("input"), b); n.type = ty; n.placeholder = t(ph); }
      });
      if (ins.length === need.length) sensPost(o);
    };
  }
}
async function sensPost(o) {
  const msg = $("sens-msg");
  msg.textContent = "";
  try {
    const r = /** @type {{status: number, body: Sensors}} */ (await fetchJson("/api/sensors", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(o)}));
    if (r.status !== 200) { msg.textContent = t(SENS_ERR[r.body.error || ""] || "sens_error"); return; }
    $("sens-seen").textContent = "";
    renderSens(r.body);
  } catch (e) { msg.textContent = t("sens_error"); }
}

const SCR = {on: "scr_on", dim: "scr_dim", off: "scr_off"};
function renderScreen(d) {
  const p = d.display;
  $("scr").hidden = p.state === null;
  if (p.state === null) return;
  $("scr-status").textContent = [t(SCR[p.state]), p.brightness_pct + " % (" + p.min + "–" + p.max + ")",
    p.lux === null ? "" : p.lux + " lx", p.sensor === "ok" ? "" : t("scr_nolux")].filter(Boolean).join(" · ");
  input("scr-auto").checked = p.auto;
  input("scr-prox").checked = p.prox_wake;
  input("scr-motion").checked = p.motion_wake;
  scrOff = p.offset;
  $("scr-off").textContent = t("scr_offset", {n: (p.offset > 0 ? "+" : "") + p.offset});
  for (const id of ["scr-auto", "scr-prox", "scr-motion", "scr-dn", "scr-up"]) input(id).disabled = d.wifi.mode !== "station";
}

let scrOff = 0;
const scrPost = (o) => fetchJson("/api/display", {method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify(o)}).catch(() => null);
const scrStep = (step) => scrPost({offset: scrOff = Math.max(-50, Math.min(50, scrOff + step))});

async function ota(action) {
  const msg = $("fw-msg");
  msg.textContent = "";
  $("fw-check").hidden = $("fw-install").hidden = true;
  try {
    const r = /** @type {{body: PostResult}} */ (await fetchJson("/api/ota", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({action: action})}));
    if (!r.body.ok) msg.textContent = t("ota_error", {error: r.body.error || ""});
  } catch (e) { msg.textContent = t("err_net"); }
}

async function otaChannel(ch) {
  const msg = $("fw-msg");
  msg.textContent = "";
  try {
    const r = /** @type {{body: PostResult}} */ (await fetchJson("/api/ota", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({channel: ch})}));
    if (r.body.ok) return;
    msg.textContent = t("fw_ch_error");
  } catch (e) { msg.textContent = t("err_net"); }
  select("fw-channel").value = $("fw-channel").dataset.v || "";
}

function renderNetworks(scan) {
  const sel = select("ssid"), keep = sel.value;
  sel.textContent = "";
  if (!scan.length) { sel.appendChild(el("option", t("no_networks"))).value = ""; return; }
  for (const ap of scan) {
    const o = el("option", ap.ssid + "  (" + ap.rssi + " dBm" + (ap.secure ? "" : ", " + t("open_unsupported")) + ")");
    o.value = ap.ssid;
    o.disabled = !ap.secure;  /* the device requires a NET_PSK_MIN..NET_PSK_MAX passphrase */
    sel.appendChild(o);
  }
  if (scan.some((ap) => ap.ssid === keep)) sel.value = keep;
}

let scanTimer = null;

async function scan() {
  const msg = $("setup-msg");
  if (scanTimer !== null) { clearTimeout(scanTimer); scanTimer = null; }
  msg.className = "";
  msg.textContent = t("scanning");
  const still = () => msg.textContent === t("scanning");  /* nothing newer (join result, error) landed */
  try {
    renderNetworks((await getWifi()).scan);
    scanTimer = setTimeout(async () => {
      scanTimer = null;
      try { renderNetworks((await getWifi()).scan); if (still()) msg.textContent = ""; }
      catch (e) { if (still()) msg.textContent = t("err_net"); }
    }, 2 * CFG.pollMs);
  } catch (e) { if (still()) msg.textContent = t("err_net"); }
}

async function connect() {
  const ssid = select("ssid").value, psk = input("psk").value, msg = $("setup-msg");
  if (scanTimer !== null) { clearTimeout(scanTimer); scanTimer = null; }
  msg.className = "bad";
  if (!ssid || ssid.length > CFG.ssidMax) { msg.textContent = t("err_ssid", {max: CFG.ssidMax}); return; }
  if (psk.length < CFG.pskMin || psk.length > CFG.pskMax) {
    msg.textContent = t("err_psk", {min: CFG.pskMin, max: CFG.pskMax}); return;
  }
  const send = () => {
    const ac = new AbortController(), timer = setTimeout(() => ac.abort(), CFG.connectTimeoutMs);
    return fetch("/api/wifi", {cache: "no-store", method: "POST", signal: ac.signal,
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({ssid: ssid, psk: psk})})
      .finally(() => clearTimeout(timer));
  };
  try {
    let res;
    try { res = await send(); }
    catch (e) {
      msg.className = "";
      msg.textContent = t("retrying");
      await new Promise((done) => setTimeout(done, CFG.connectRetryMs));
      msg.className = "bad";
      res = await send();
    }
    const r = {body: /** @type {PostResult} */ (await res.json())};
    if (!r.body.ok) {
      const e = POST_ERROR[r.body.error || ""] || "err_json";
      msg.textContent = t(e, {max: e === "err_ssid" ? CFG.ssidMax : CFG.pskMax, min: CFG.pskMin});
      return;
    }
    input("psk").value = "";
    msg.className = "";
    msg.textContent = t("joining", {ssid: ssid});
    joining = {ssid: ssid, polls: 0, left: false};
  } catch (e) { msg.textContent = t("err_net"); }
}

async function watchJoin(j) {
  const msg = $("setup-msg");
  const w = await getWifi();
  j.polls++;
  if (w.mode !== "setup") j.left = true;
  if (w.mode === "station" && w.ip) {
    msg.className = "";
    msg.textContent = t("joined", {ip: w.ip, ssid: j.ssid}) + " ";
    const url = "http://" + CFG.host + ".local";
    const a = el("a", url);
    a.href = url;
    msg.appendChild(a);
    joining = null;
  } else if (w.mode === "setup" && (j.left || j.polls > 3)) {
    msg.className = "bad";
    msg.textContent = t(JOIN_FAILED[w.last_error || ""] || "join_failed_other");
    joining = null;
  }
}

let setupShown = false;
async function poll() {
  try {
    if (joining) await watchJoin(joining);
    const s = (/** @type {{body: State}} */ (await fetchJson("/api/state"))).body;
    $("banner").style.display = "none";
    renderLink(s.device);
    renderFw(s.device);
    renderAutoCamper(s.device);
    renderUx(s.device);
    renderExp(s.device);
    renderSensors(s.device);
    renderScreen(s.device);
    renderTime(s.device.time);
    renderSd(s.device.sd);
    renderRes(s.device.res);
    renderBattery(s.device.battery);
    const setup = s.device.wifi.mode === "setup" || joining !== null || $("setup-msg").querySelector("a") !== null;
    $("setup").hidden = !setup;
    if (setup && !setupShown && !joining) scan();
    setupShown = setup;
  } catch (e) {
    $("banner").textContent = t("offline");
    $("banner").style.display = "block";
  }
  setTimeout(poll, CFG.pollMs);
}

$("connect").addEventListener("click", connect);
$("rescan").addEventListener("click", scan);
$("ac-toggle").addEventListener("click", () => toggle("/api/auto_camper", "ac", "ac_error"));
$("ux-toggle").addEventListener("click", () => toggle("/api/ux_setting", "ux", "ux_error"));
$("exp-toggle").addEventListener("click", () => toggle("/api/experimental", "exp", "exp_error", "sensors"));
for (const [id, k] of [["scr-auto", "auto"], ["scr-prox", "prox_wake"], ["scr-motion", "motion_wake"]]) $(id).addEventListener("change", () => scrPost({[k]: input(id).checked}));
$("scr-dn").addEventListener("click", () => scrStep(-5));
$("scr-up").addEventListener("click", () => scrStep(5));
$("fw-check").addEventListener("click", () => ota("check"));
$("fw-install").addEventListener("click", () => ota("install"));
$("fw-channel").addEventListener("change", () => otaChannel(select("fw-channel").value));
poll();
</script>
</body>
</html>
