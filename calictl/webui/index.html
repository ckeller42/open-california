<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open California</title>
<link rel="stylesheet" href="/app.css">
<!-- Installable web app (Add to Home Screen). The offline shell (sw.js, registered by app.js) needs
     HTTPS: only the tailnet fronts get it; plain http on the LAN is the installable-fullscreen subset. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#12395c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Open California">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
</head>
<body>
<header id="topbar">
  <button id="back" hidden aria-label="Back">‹</button>
  <h1 id="title" tabindex="-1">Vehicle</h1>
  <button id="status" type="button" class="pill" aria-live="polite" aria-label="Device status">…</button>
  <button id="menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false">⋮</button>
</header>
<div id="app"></div>
<div id="toasts" aria-live="polite" role="status"></div>
<script src="/strings.de.js"></script>
<script src="/semantics_tables.js"></script>
<script src="/semantics.js"></script>
<script src="/app.js"></script>
</body>
</html>
