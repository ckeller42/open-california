# journald retention for buspi — install as /etc/systemd/journald.conf.d/calictl.conf
#
# Why: the daemon logs its decisions (auto-camper arm/stand-down, poll outcomes, connection
# errors) to stdout, which systemd captures into the journal. journald on the Pi is already
# PERSISTENT (/var/log/journal exists) but ships with a small default cap — in practice only
# ~1 day of calictl history survived, too short to analyse a van session after the fact.
#
# This raises the on-disk budget and adds a time floor so a session stays analysable for weeks:
#   journalctl -u calictl.service --grep auto-camper [-o json]
#
# Install:
#   sudo install -D -m0644 journald-calictl.conf /etc/systemd/journald.conf.d/calictl.conf
#   sudo systemctl restart systemd-journald
# Verify:  journalctl --disk-usage   and   journalctl -u calictl.service | head -1  (goes further back)
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=1G
MaxRetentionSec=4week
