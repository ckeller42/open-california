# Gemini Code Assist (GitHub app) — repo review config.
# Docs: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
# Project rules Gemini should review against live in .gemini/styleguide.md (authority: CLAUDE.md).
have_fun: false
code_review:
  disable: false
  # HIGH: this repo already runs CodeRabbit for style/nits — keep Gemini to substantive findings
  # (correctness, the stdlib-only/BLE-owner/semantics-polarity invariants), not a second nit stream.
  comment_severity_threshold: HIGH
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: false        # CodeRabbit already posts a PR summary; don't duplicate it.
    code_review: true
    include_drafts: false
# Generated / vendored / non-source paths: reviewing them wastes comments and they're either
# machine-generated (regenerate, never hand-edit) or gitignored vendor material.
ignore_patterns:
  - "decompile/**"
  - "manuals/**"
  - "docs/**"
  - "csrc/codec_dict.h"        # generated by tools/gen_c_dict.py (CI-verified fresh)
  - "tests/vectors/**"         # generated golden vectors (tools/gen_codec_vectors.py)
  - "calictl/webui/screens.json"  # built by tools/build_web (CI-verified fresh)
  - "**/*.min.js"
