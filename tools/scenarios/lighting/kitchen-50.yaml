# The prize: capture the app setting the Kitchen zone to ~50% brightness, then diff.
# calictl's SET_BRIGHTNESS is ACKed but never applies (re-gap-inventory.md §A1); this diff
# should surface the field the app carries that we send as 0 — leading suspect LightValue
# (a per-zone enable mask) or a SET_PROFILE (Mode=16) preamble frame.
#
# Capture SOP: in the app, open Lighting, set the Kitchen zone to 50%, label the capture
# "kitchen-50". Zone->physical-lamp mapping is UNVERIFIED, so confirm which zone reacted.
function: lighting
what: brightness
value: 8               # ~50% of 0..15
control_char: "1501"
capture_label: kitchen-50
state: {}             # fill with the decoded 1502 state at capture time if known
